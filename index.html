// 시트: 확인 (저장하지 않고 나갈까요? 등)
function confirmSheet(sh) {
  return `<div class="sh-h"><div><h2>${esc(sh.title)}</h2><p>${esc(sh.msg)}</p></div></div>
    <div class="sh-foot col">${sh.btns.map(b => `<button class="btn ${b.cls}" data-act="${b.act}" ${b.id ? `data-id="${b.id}"` : ''}>${esc(b.t)}</button>`).join('')}</div>`;
}
// 열려 있는 시트 그리기 (SHEETS 목록에서 찾아요)
function sheetV() {
  const sh = S.sheet;
  if (!sh) return '';
  const inner = SHEETS[sh.type]
    ? SHEETS[sh.type](sh)
    : sh.type === 'leg'
      ? legSheet(sh)
      : sh.type === 'add'
        ? addSheet(sh)
        : sh.type === 'dayTime'
          ? dayTimeSheet()
          : sh.type === 'rename'
            ? renameSheet()
            : sh.type === 'ja'
              ? jaSheet(sh)
              : confirmSheet(sh);
  return `<div class="scrim" data-act="closeSheet"></div><div class="sheet s-${sh.type}" role="dialog" aria-modal="true" aria-label="${SHEET_LABEL[sh.type] || '확인'}"><span class="handle" aria-hidden="true"></span>${inner}</div>`;
}

// ---- 렌더 ----
function render() {
  const y = window.scrollY,
    shEl = document.querySelector('.sheet'),
    shY = shEl ? shEl.scrollTop : 0;
  const v = S.view === 'home' ? homeV() : S.view === 'dates' ? datesV() : S.view === 'areas' ? areasV() : planV();
  $app.innerHTML = `<div class="shell v-${S.view}">${v}${sheetV()}<div class="toasts" id="toasts" aria-live="polite"></div></div>`;
  document.body.classList.toggle('locked', !!S.sheet);
  const sh = document.querySelector('.sheet');
  if (sh && S.keepSheetScroll) sh.scrollTop = shY;
  S.keepSheetScroll = false;
  window.scrollTo(0, y);
  drawMaps();
  wireHero();
  if (typeof navSync === 'function') navSync();
}
// 다른 화면으로 가기 (home·dates·areas·plan)
function go(view) {
  S.view = view;
  S.sheet = null;
  render();
  window.scrollTo(0, 0);
}

// ---- 동작 ----
const A = {
  goHome() {
    if (S.view === 'plan' && !S.saved) {
      S.sheet = {
        type: 'confirm',
        title: '저장하지 않고 나갈까요?',
        msg: '이번에 바꾼 내용이 사라져요.',
        btns: [
          { t: '저장하고 나가기', cls: 'pri', act: 'saveLeave' },
          { t: '저장 안 하고 나가기', cls: 'soft danger', act: 'leaveNoSave' },
          { t: '취소', cls: 'ghost', act: 'closeSheet' }
        ]
      };
      render();
      return;
    }
    S.plan = null;
    go('home');
  },
  leaveNoSave() {
    S.plan = null;
    S.saved = true;
    go('home');
  },
  saveLeave() {
    A.save();
    S.plan = null;
    go('home');
  },
  saveGuide() {
    A.save(null, null, null, true);
  },
  showJa(d) {
    S.sheet = { type: 'ja', i: Number(d.i) };
    render();
  },
  toGuide(d) {
    S.sheet = null;
    S.tab = 'guide';
    render();
    const el = document.getElementById('g-' + d.li);
    if (el) window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 140) });
  },
  newPlan() {
    S.draft = defaultDraft();
    S.mv = null;
    go('dates');
  },
  calMove(d) {
    S.draft.cal = addMonth(S.draft.cal, Number(d.n));
    render();
  },
  pickDate(d) {
    const D = S.draft,
      s = d.d;
    if (!D.start || (D.start && D.end)) {
      D.start = s;
      D.end = null;
    } else if (s < D.start) {
      D.start = s;
    } else if (dayDiff(D.start, s) > 9) {
      D.end = ymd(new Date(pd(D.start).getTime() + 9 * 864e5));
      toast('최대 10일까지 고를 수 있어요.');
    } else D.end = s;
    render();
  },
  setHotel(d) {
    S.draft.hotel = d.v;
    render();
  },
  toAreas() {
    if (S.draft.start && S.draft.end) go('areas');
  },
  toDates() {
    go('dates');
  },
  toggleArea(d) {
    const a = S.draft.areas,
      i = a.indexOf(d.id);
    if (i >= 0) a.splice(i, 1);
    else a.push(d.id);
    render();
  },
  zoom(d) {
    const base = S.mvBase;
    if (!base) return;
    const mv = S.mv || { ...base },
      f = Number(d.n) > 0 ? 0.7 : 1 / 0.7;
    const w = clamp(mv.w * f, base.w * 0.3, base.w),
      h = (w * base.h) / base.w,
      cx = mv.x + mv.w / 2,
      cy = mv.y + mv.h / 2;
    S.mv = w >= base.w * 0.999 ? null : { x: cx - w / 2, y: cy - h / 2, w, h };
    render();
  },
  generate() {
    const D = S.draft;
    S.plan = createPlan(
      {
        start: D.start,
        end: D.end,
        hotel: D.hotel,
        stays: D.stays,
        arrive: D.arrive,
        depart: D.depart,
        dayStart: D.dayStart,
        dayEnd: D.dayEnd
      },
      D.areas
    );
    S.saved = false;
    S.isNew = true;
    S.di = 0;
    S.tab = 'sched';
    S.sel = null;
    S.undo = [];
    S.banner = null;
    go('plan');
    toast('일정을 만들었어요. 마음에 들면 저장하세요.');
  },
  openPlan(d) {
    const p = S.plans.find(x => x.id === d.id);
    if (!p) return;
    S.plan = clone(p);
    S.saved = true;
    S.isNew = false;
    S.undo = [];
    S.banner = null;
    S.sel = null;
    S.tab = d.tab || 'sched';
    S.di = Math.min(planStatus(p).di, p.days.length - 1);
    go('plan');
  },
  save(d, el, e, toGuide) {
    const p = S.plan;
    p.updated = Date.now();
    const i = S.plans.findIndex(x => x.id === p.id),
      first = i < 0;
    if (i >= 0) S.plans[i] = clone(p);
    else S.plans.push(clone(p));
    const ok = store.writeLocal(S.plans);
    store.put(p);
    S.saved = true;
    S.isNew = false;
    if (S.view === 'plan') {
      if (first || toGuide) {
        S.tab = 'guide';
        S.sel = null;
      }
      render();
      if (first || toGuide) window.scrollTo(0, 0);
      toast(
        !(ok || store.mode === 'account')
          ? '저장했지만 이 브라우저에선 보관이 안 될 수 있어요.'
          : first || toGuide
            ? '저장했어요. 구간별 이동 안내가 만들어졌어요.'
            : '저장했어요.'
      );
    }
  },
  delAsk(d) {
    const p = S.plans.find(x => x.id === d.id);
    S.sheet = {
      type: 'confirm',
      title: `'${p.title}' 삭제할까요?`,
      msg: '삭제하면 되돌릴 수 없어요.',
      btns: [
        { t: '삭제', cls: 'pri danger-fill', act: 'delPlan', id: d.id },
        { t: '취소', cls: 'ghost', act: 'closeSheet' }
      ]
    };
    render();
  },
  delPlan(d) {
    S.plans = S.plans.filter(x => x.id !== d.id);
    store.writeLocal(S.plans);
    store.remove(d.id);
    S.sheet = null;
    render();
    toast('계획을 삭제했어요.');
  },
  tab(d) {
    S.tab = d.t;
    S.sel = null;
    render();
    window.scrollTo(0, 0);
  },
  day(d) {
    S.di = Number(d.i);
    S.sel = null;
    S.mapSel = null;
    S.banner = null;
    render();
  },
  fareDay(d) {
    S.di = Number(d.i);
    S.tab = 'sched';
    render();
    window.scrollTo(0, 0);
  },
  sel(d) {
    S.sel = S.sel === d.uid ? null : d.uid;
    render();
  },
  mapPick(d) {
    S.mapSel = S.mapSel === d.uid ? null : d.uid;
    S.sel = S.mapSel;
    render();
    const el = document.querySelector('.sp.on');
    if (el) el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  },
  hideHint() {
    S.hintOff = true;
    lsSet('fk-hint-off', true);
    render();
  },
  rename() {
    S.sheet = { type: 'rename' };
    render();
    setTimeout(() => {
      const i = document.getElementById('renameIn');
      if (i) {
        i.focus();
        i.select();
      }
    }, 30);
  },
  applyRename() {
    const v = (document.getElementById('renameIn').value || '').trim();
    if (v) {
      S.plan.title = v.slice(0, 40);
      dirty();
    }
    S.sheet = null;
    render();
  },
  leg(d) {
    S.sheet = { type: 'leg', li: Number(d.li), picks: [], mode: null, recs: null };
    render();
  },
  legMode(d) {
    const sh = S.sheet,
      id = d.mode;
    if (id === 'walk') {
      sh.mode = 'walk';
      S.keepSheetScroll = true;
      render();
      return;
    }
    const p = S.plan,
      { Akey, Bkey } = legEnds(p, S.di, sh.li),
      before = computeDay(p, S.di).endArr;
    pushUndo();
    p.days[S.di].modes[Akey + '>' + Bkey] = id;
    dirty();
    S.sheet = null;
    render();
    const after = computeDay(p, S.di).endArr,
      dlt = after - before,
      m = id.replace(/\d+$/, '');
    toast(
      `${MODE[m].n}(으)로 바꿨어요.${dlt ? ` 이후 일정이 ${Math.abs(dlt)}분 ${dlt > 0 ? '늦어져요' : '당겨져요'}.` : ''}`,
      true
    );
  },
  recToggle(d) {
    const pk = S.sheet.picks,
      i = pk.indexOf(d.id);
    if (i >= 0) pk.splice(i, 1);
    else pk.push(d.id);
    S.keepSheetScroll = true;
    render();
  },
  applyWalk() {
    const sh = S.sheet;
    if (!sh.picks.length) return;
    pushUndo();
    const res = applyWalk(S.plan, S.di, sh.li, sh.picks.slice());
    S.banner = { title: '걷는 길로 바꾸고 이후 일정을 다시 짰어요', res };
    dirty();
    S.sheet = null;
    S.sel = null;
    S.tab = 'sched';
    render();
    const el = document.querySelector('.banner');
    if (el)
      window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 130), behavior: 'smooth' });
  },
  walkOnly() {
    const sh = S.sheet,
      p = S.plan,
      day = p.days[S.di],
      { Akey, Bkey } = legEnds(p, S.di, sh.li);
    pushUndo();
    const before = computeDay(p, S.di).endArr;
    day.modes[Akey + '>' + Bkey] = 'walk';
    if (computeDay(p, S.di).over > 10) {
      const fixed = Bkey === 'E' ? day.items.length : day.items.findIndex(i => i.uid === Bkey) + 1;
      const res = replanFrom(p, S.di, fixed);
      res.endBefore = before;
      S.banner = { title: '걷기로 바꾸고 늦어진 만큼 일정을 정리했어요', res };
    }
    dirty();
    S.sheet = null;
    render();
    const dlt = computeDay(p, S.di).endArr - before;
    if (!S.banner)
      toast(
        `걷기로 바꿨어요.${dlt ? ` 이후 일정이 ${Math.abs(dlt)}분 ${dlt > 0 ? '늦어져요' : '당겨져요'}.` : ''}`,
        true
      );
  },
  replanDay() {
    pushUndo();
    const res = replanFrom(S.plan, S.di, leadingFixed(S.plan.days[S.di]));
    S.banner = { title: `${S.di + 1}일차 일정을 다시 짰어요`, res };
    dirty();
    S.sel = null;
    S.tab = 'sched';
    render();
  },
  replanHere(d) {
    const day = S.plan.days[S.di],
      idx = day.items.findIndex(i => i.uid === d.uid),
      name = itemName(S.plan, day.items[idx]);
    pushUndo();
    const res = replanFrom(S.plan, S.di, Math.max(idx, leadingFixed(day)));
    S.banner = { title: `'${name}'부터 다시 짰어요`, res };
    dirty();
    S.sel = null;
    render();
  },
  closeBanner() {
    S.banner = null;
    render();
  },
  undo() {
    const u = S.undo.pop();
    if (!u) {
      toast('되돌릴 내용이 없어요.');
      return;
    }
    S.plan = u.plan;
    S.di = u.di;
    S.banner = null;
    S.sel = null;
    dirty();
    render();
    toast('되돌렸어요.');
  },
  stay(d) {
    const it = S.plan.days[S.di].items.find(i => i.uid === d.uid);
    pushUndo();
    it.stay = clamp(it.stay + Number(d.n), 15, 600);
    dirty();
    render();
  },
  move(d) {
    const items = S.plan.days[S.di].items,
      i = items.findIndex(x => x.uid === d.uid),
      j = i + Number(d.n);
    if (j < 0 || j >= items.length) return;
    const before = computeDay(S.plan, S.di);
    pushUndo();
    [items[i], items[j]] = [items[j], items[i]];
    items.forEach(x => {
      if (x.fixed) x.fixed = false;
    });
    cleanModes(S.plan, S.di);
    dirty();
    const after = computeDay(S.plan, S.di),
      diff = after.endArr - before.endArr,
      k = Math.max(i, j);
    // 뒤로 밀린 쪽(둘 중 뒤에 있는 곳) 아래에 물어봐요
    S.reAsk =
      (diff >= 10 || after.over > Math.max(0, before.over)) && k < items.length - 1
        ? { uid: items[k].uid, di: S.di, at: S.editN, diff }
        : null;
    render();
  },
  reAskNo() {
    S.reAsk = null;
    render();
  },
  reAskYes() {
    const q = S.reAsk;
    S.reAsk = null;
    if (!q) return;
    const day = S.plan.days[S.di],
      idx = day.items.findIndex(x => x.uid === q.uid);
    if (idx < 0) {
      render();
      return;
    }
    pushUndo();
    const res = replanFrom(S.plan, S.di, idx + 1);
    S.banner = {
      title: L(
        `'${itemName(S.plan, day.items[idx])}' 뒤쪽 일정을 다시 짰어요`,
        `「${day.items[idx].sid ? SPOT[day.items[idx].sid].j : itemName(S.plan, day.items[idx])}」より後ろの予定を組み直しました`
      ),
      res
    };
    dirty();
    S.sel = null;
    render();
  },
  toPark(d) {
    const day = S.plan.days[S.di],
      i = day.items.findIndex(x => x.uid === d.uid);
    pushUndo();
    const [it] = day.items.splice(i, 1);
    park(S.plan, S.di, it, '직접 뺀 곳');
    cleanModes(S.plan, S.di);
    S.sel = null;
    dirty();
    render();
    toast(`${itemName(S.plan, it)}을(를) 보류함으로 옮겼어요.`, true);
  },
  unpark(d) {
    const p = S.plan,
      k = p.parked.findIndex(x => x.uid === d.uid);
    if (k < 0) return;
    pushUndo();
    const [x] = p.parked.splice(k, 1);
    const { reason, fromDay, ...it } = x;
    it.src = 'user';
    const pos = insertBest(p, S.di, it);
    S.openParked = true;
    dirty();
    render();
    toast(`${S.di + 1}일차 ${pos + 1}번째에 넣었어요.`, true);
  },
  delParked(d) {
    pushUndo();
    S.plan.parked = S.plan.parked.filter(x => x.uid !== d.uid);
    S.openParked = true;
    dirty();
    render();
  },
  addOpen() {
    S.sheet = { type: 'add', q: '', cat: 'all', added: [] };
    render();
  },
  addCat(d) {
    S.sheet.cat = d.v;
    S.keepSheetScroll = true;
    render();
  },
  addSpot(d) {
    const p = S.plan;
    pushUndo();
    p.parked = p.parked.filter(x => x.sid !== d.id);
    const pos = insertBest(p, S.di, mkItem(d.id, 'user'));
    S.sheet.added.push(d.id);
    dirty();
    const list = document.getElementById('addList');
    if (list) list.innerHTML = addListHTML(S.sheet);
    toast(`${SPOT[d.id].n}을(를) ${pos + 1}번째에 넣었어요.`, true);
  },
  addCustom() {
    const el = document.getElementById('cName'),
      name = (el.value || '').trim();
    if (!name) {
      el.focus();
      toast('이름을 적어 주세요.');
      return;
    }
    const stay = Number(document.getElementById('cStay').value),
      p = S.plan,
      c = computeDay(p, S.di),
      at = c.rows.length ? c.rows[c.rows.length - 1].p : c.startPt;
    pushUndo();
    p.days[S.di].items.push({
      uid: uid(),
      n: name,
      lat: at.lat,
      lng: at.lng,
      z: at.z,
      stay,
      src: 'user',
      custom: true
    });
    cleanModes(p, S.di);
    dirty();
    S.sheet = null;
    render();
    toast(`'${name}'을(를) 마지막에 넣었어요.`, true);
  },
  dayTime() {
    S.sheet = { type: 'dayTime' };
    render();
  },
  applyDayTime() {
    const s = document.getElementById('dtStart').value,
      e = document.getElementById('dtEnd').value;
    if (toMin(e) <= toMin(s) + 30) {
      toast('마무리 시간이 출발보다 늦어야 해요.');
      return;
    }
    pushUndo();
    const day = S.plan.days[S.di];
    day.start.time = s;
    day.end.time = e;
    const res = replanFrom(S.plan, S.di, leadingFixed(day));
    S.banner = { title: '시간을 바꾸고 일정을 다시 짰어요', res };
    dirty();
    S.sheet = null;
    render();
  },
  closeSheet() {
    S.sheet = null;
    render();
  }
};

    if (it) {
      it.memo = t.value;
      dirty();

    const l = document.getElementById('addList');
    if (l) l.innerHTML = addListHTML(S.sheet);

    return;

    stayFromChange(t);

function rng(seed) {
  let s = seed;
  return () => {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

// 상단 사진은 시간대에 맞춰 낮/밤이 저절로 바뀌어요
function heroScene() {
  const n = new Date(),
    m = n.getHours() * 60 + n.getMinutes(),
    ss = SUNSET[n.getMonth() + 1] || 1110;
  return m < 330 || m > ss + 30 ? 'night' : 'day';
}

// ★ 홈 상단 (사진·제목)
function heroV(f) {
  const sc = heroScene(),
    hp = heroPhoto(sc),
    stock = !S.photoBroken;
  let txt;
  if (f) {
    const st = planStatus(f);
    txt = `<span class="dday b-${st.k}">${st.label}</span><h1 class="hero-t">${esc(f.title)}</h1><p class="hero-s">${md(f.set.start)} – ${md(f.set.end)} · ${nights(f.days.length)}</p>`;
  } else
    txt = `<p class="hero-k">FUKUOKA <span lang="ja">福岡</span></p><h1 class="hero-t">후쿠오카,<br>어디부터 갈까요?</h1><p class="hero-s">날짜와 동네만 고르면 동선·교통비까지 짜 드려요</p>`;
  return `<section class="hero t-${sc}${stock ? ' has-photo' : ''}">

}

// 동네 대표 종류
function areaMainCat(id) {
  const n = {};
  SPOTS.filter(s => s.a === id).forEach(s => {
    n[s.c] = (n[s.c] || 0) + 1;
  });
  return Object.entries(n).sort((a, b) => b[1] - a[1])[0]?.[0] || 'sight';
}
// 동네 설명 줄
function areaMeta(a) {
  const tm = a.min + 2 * accessMin(a.z);
  return a.kind === 'trip'
    ? `당일치기 · ${a.far}`
    : `${a.kind === 'outer' ? '근교' : '시내'} · ${tm >= 400 ? '하루' : tm >= 240 ? '반나절+' : '반나절'}`;
}
// 홈 「동네 둘러보기」 사진 타일
function areaTile(a) {
  const n = SPOTS.filter(s => s.a === a.id).length,
    [c1, c2] = AREA_TONE[a.id] || ['#F0703A', '#B92E1C'];
  const ph = areaPh(a.id);
  return `<button class="atile" data-act="areaSheet" data-id="${a.id}" style="--c1:${c1};--c2:${c2}">
    <span class="at-art${ph ? ' has-ph' : ''}">${ph ? areaImg(a.id).replace('<img ', '<img loading="lazy" ') : ''}<span class="at-ja" lang="ja">${AREA_JA[a.id] || ''}</span>${ic(areaMainCat(a.id), 'at-ic')}</span>
    <span class="at-b"><b>${a.n}</b><small>${esc(a.sub)}</small><em>${a.kind === 'trip' ? a.far : a.kind === 'outer' ? '근교' : '시내'} · ${n}곳</em></span>
  </button>`;
}

// 홈의 가장 가까운 여행 카드
function tripCard(p) {
  const st = planStatus(p),
    di = Math.min(st.di, p.days.length - 1),
    c = computeDay(p, di),
    rows = c.rows.slice(0, 3),
    fp = farePlan(p);
  const visits = p.days.reduce((t, d) => t + d.items.filter(i => i.sid).length, 0);
  return `<article class="tcard">
    <div class="tc-h"><div><b>${st.k === 'now' ? '오늘 일정' : '첫날 미리보기'}</b><small>${di + 1}일차 · ${md(p.days[di].date)}</small></div>
      <button class="ib sm" data-act="delAsk" data-id="${p.id}" aria-label="${esc(p.title)} 삭제">${ic('trash')}</button></div>
    <ol class="mini">${rows.map(r => `<li><b>${fmt(r.arr)}</b>${r.it.sid ? catTile(SPOT[r.it.sid].c) : catTile(r.it.place === 'hotel' ? 'bed' : 'free')}<span>${esc(itemName(p, r.it))}</span></li>`).join('')}
      ${c.rows.length > rows.length ? `<li class="more">그 밖에 ${c.rows.length - rows.length}곳</li>` : ''}${!c.rows.length ? '<li class="more">아직 일정이 없어요</li>' : ''}</ol>
    <div class="tc-s"><span>방문 <b>${visits}곳</b></span><span>교통비 <b>${fp.approx ? '약 ' : ''}${yen(fp.best)}</b></span><span>숙소 <b>${staysOf(p).length > 1 ? L(`${staysOf(p).length}곳`, `${staysOf(p).length}か所`) : esc(hotelWhereT(nightHotel(p, 0)))}</b></span></div>
    <div class="qa">${[
      ['sched', 'list', '일정'],
      ['map', 'map', '지도'],
      ['guide', 'nav', '이동 안내'],
      ['fare', 'wallet', '교통비']
    ]
      .map(
        ([t, i, l]) =>
          `<button data-act="openPlan" data-id="${p.id}" data-tab="${t}"><span>${ic(i)}</span>${l}</button>`
      )
      .join('')}</div>
  </article>`;
}

        const steps = on
          ? guideFor(o, A, B).map(s =>
              s.taxi ? { ...s, d: '터미널 앞 택시 승강장에서 타요. 호텔 이름과 주소(일본어)를 보여 주면 돼요.' } : s

        return `<div class="aopt${on ? ' on' : ''}"><button class="opt${on ? ' on' : ''}" data-act="airOpt" data-o="${o.id}" aria-expanded="${on}">
          ${modeIc(o.mode)}<span class="ob"><span class="o1"><b>${MODE[o.mode].n}</b>${o.mode === 'subway' ? '<span class="tag cheap">가장 쌈</span>' : o.mode === 'taxi' ? '<span class="tag fast">가장 빠름</span>' : ''}</span>

  );
}

// ---- 계획 옮기기·공유 (웹 ↔ 앱 ↔ 다른 기기 ↔ 친구) ----
function planCode(plans) {
  const json = JSON.stringify({ v: 1, app: 'fukuoka-planner', at: Date.now(), plans });
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return 'FKP1:' + btoa(bin);
}
// 링크용: 압축(deflate) + URL에 안전한 base64 → 「FKZ1.…」. 압축을 못 하는 브라우저면 FKP1 그대로
const b64u = {
  enc(u8) {
    let bin = '';
    for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  dec(t) {
    t = t.replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    const bin = atob(t);
    return Uint8Array.from(bin, c => c.charCodeAt(0));
  }
};
// 계획 → 링크용 압축 코드 (FKZ1.…)
async function shareCode(plans) {
  if (typeof CompressionStream === 'undefined') return planCode(plans);
  try {
    const json = JSON.stringify({ v: 1, app: 'fukuoka-planner', at: Date.now(), plans });
    const buf = await new Response(
      new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'))
    ).arrayBuffer();
    return 'FKZ1.' + b64u.enc(new Uint8Array(buf));
  } catch (e) {
    return planCode(plans);
  }
}
// 공유 링크 만들기
function shareUrl(code) {
  return location.href.split('#')[0] + '#share=' + encodeURIComponent(code);
}
// 코드 → 계획 (잘못된 계획은 걸러요)
function readCode(txt) {
  txt = String(txt || '').trim();
  if (!txt) throw new Error('empty');
  let json = txt;
  const k = txt.indexOf('FKP1:');
  if (k >= 0) {
    const bin = atob(txt.slice(k + 5).replace(/[^A-Za-z0-9+/=]/g, ''));
    json = new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  }
  const o = JSON.parse(json),
    arr = Array.isArray(o) ? o : o && o.plans;
  if (!Array.isArray(arr)) throw new Error('shape');
  const ok = arr.filter(
    p =>
      p &&
      typeof p.id === 'string' &&
      /^plan-[\w-]+$/.test(p.id) &&
      typeof p.title === 'string' &&
      p.set &&
      typeof p.set.start === 'string' &&
      Array.isArray(p.days) &&
      p.days.length &&
      p.days.every(d => d && Array.isArray(d.items))
  );
  if (!ok.length) throw new Error('none');
  return ok.map(prunePlan);
}
// 코드·링크 어느 쪽이든 읽기 (FKZ1 압축 코드 / FKP1 코드 / JSON / 링크 통째로 붙여 넣은 것)
async function readAnyCode(txt) {
  txt = String(txt || '').trim();
  try {
    txt = decodeURIComponent(txt);
  } catch (e) {}
  const m = txt.match(/FKZ1\.([A-Za-z0-9_-]+)/);
  if (m) {
    if (typeof DecompressionStream === 'undefined') throw new Error('nozip');
    const buf = await new Response(
      new Blob([b64u.dec(m[1])]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
    ).arrayBuffer();
    if (buf.byteLength > 4e6) throw new Error('big');
    return readCode(new TextDecoder().decode(buf));
  }
  return readCode(txt);
}
// 받은 계획 넣기 (같은 계획은 더 최근 것으로)
function importPlans(list) {
  const map = new Map(S.plans.map(p => [p.id, p]));
  let add = 0,
    upd = 0;
  list.forEach(p => {
    const o = map.get(p.id);
    if (!o) {
      map.set(p.id, clone(p));
      add++;
    } else if ((p.updated || 0) > (o.updated || 0)) {
      map.set(p.id, clone(p));
      upd++;
    }
  });
  S.plans = [...map.values()];
  store.writeLocal(S.plans);
  list.forEach(p => store.put(map.get(p.id)));
  return { add, upd };
}
// 받은 계획을 내 것과 따로 사본으로 넣기 (새 id)
function importCopies(list) {
  list.forEach((p, i) => {
    const c = clone(p);
    c.id = 'plan-' + Date.now().toString(36) + i + Math.random().toString(36).slice(2, 6);
    c.title = `${p.title} ${L('(받은 계획)', '(届いた計画)')}`;
    c.created = c.updated = Date.now();
    S.plans.push(c);
    store.put(c);
  });
  store.writeLocal(S.plans);
  return { add: list.length, upd: 0 };
}

// 글자 복사
async function copyText(txt) {
  try {
    await navigator.clipboard.writeText(txt);
    return true;
  } catch (e) {}
  const t = document.createElement('textarea');
  t.value = txt;
  t.setAttribute('readonly', '');
  t.style.cssText = 'position:fixed;opacity:0;top:0';
  document.body.appendChild(t);
  t.select();
  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (e) {}
  t.remove();
  return ok;
}

async function checkShareLink() {
  const m = location.hash.match(/^#share=(.+)$/);
  if (!m) return;
  try {
    history.replaceState(null, '', location.href.split('#')[0]);
  } catch (e) {}
  try {
    const plans = await readAnyCode(m[1]);
    S.sheet = { type: 'recv', plans, code: planCode(plans) };
    render();
  } catch (e) {
    toast(
      L(
        '받은 링크에서 계획을 읽지 못했어요. 링크가 중간에 잘리지 않았는지 확인해 주세요.',
        'リンクから計画を読み込めませんでした。リンクが途中で切れていないか確認してください。'
      )
    );
  }
}

function xferFromFile(file) {

    readAnyCode(fr.result)
      .then(l => afterImport(importPlans(l)))
      .catch(() => toast('이 파일에서 계획을 찾지 못했어요.'));

  fr.readAsText(file);
}

function nearStation(s) {
  let best = null;
  for (const [id, st] of Object.entries(STATIONS)) {
    const d = km(s, st);

  }

}

// ======================================================================
// drag.js · 일정 카드 끌어서 순서 바꾸기
// 카드 오른쪽 ≡ 손잡이를 끌면 순서가 바뀌어요. 화면 끝에 가면 저절로 스크롤해요.
// 고치는 법: docs/수정가이드.md
// ======================================================================
// ---- 일정 순서: ≡ 손잡이를 끌어서 바꾸기 (손가락·마우스 모두) ----
let DRAG = null;
function dragStart(e, hnd) {
  const li = hnd.closest('li.stop'),
    tl = li && li.closest('.tl');
  if (!li || !tl) return;
  const list = [...tl.querySelectorAll(':scope > li.stop')],
    from = list.indexOf(li);
  if (from < 0 || list.length < 2) return;
  e.preventDefault();
  const sy = window.scrollY,
    tlTop = tl.getBoundingClientRect().top + sy;
  const boxes = list.map(x => {
    const r = x.getBoundingClientRect();
    return { top: r.top + sy, bot: r.bottom + sy };
  });
  const ind = document.createElement('div');
  ind.className = 'drop-ind';
  tl.appendChild(ind);
  DRAG = {
    uid: hnd.dataset.uid,
    li,
    tl,
    list,
    from,
    to: from,
    boxes,
    tlTop,
    ind,
    y0: e.clientY + sy,
    cy: e.clientY,
    pid: e.pointerId,
    raf: 0
  };
  try {
    hnd.setPointerCapture(e.pointerId);
  } catch (_) {}
  li.classList.add('dragging');
  document.body.classList.add('is-dragging');
  if (navigator.vibrate)
    try {
      navigator.vibrate(8);
    } catch (_) {}

  DRAG.raf = requestAnimationFrame(dragTick);
}
function dragPaint() {
  const d = DRAG;
  if (!d) return;
  const y = d.cy + window.scrollY;
  d.li.style.transform = `translateY(${Math.round(y - d.y0)}px)`;
  // 끄는 카드를 뺀 나머지 중, 손가락보다 위에 있는(가운데 기준) 카드 수 = 놓을 자리
  const others = d.boxes.filter((b, i) => i !== d.from);
  let t = 0;
  others.forEach(b => {
    if ((b.top + b.bot) / 2 < y) t++;
  });
  d.to = t;
  const gapY = t < others.length ? others[t].top - 6 : others[others.length - 1].bot + 6;
  d.ind.style.top = `${Math.round(gapY - d.tlTop)}px`;
  d.ind.classList.toggle('same', t === d.from);
}
function dragTick() {
  const d = DRAG;
  if (!d) return;
  // 화면 위·아래 끝에 가까우면 저절로 스크롤
  const top = 120,
    bot = window.innerHeight - 110;
  const v = d.cy < top ? -Math.min(18, (top - d.cy) / 4 + 2) : d.cy > bot ? Math.min(18, (d.cy - bot) / 4 + 2) : 0;
  if (v) {
    window.scrollBy(0, v);
    dragPaint();
  }
  d.raf = requestAnimationFrame(dragTick);
}
function dragEnd(ok) {
  const d = DRAG;
  if (!d) return;
  DRAG = null;
  cancelAnimationFrame(d.raf);
  d.li.classList.remove('dragging');
  d.li.style.transform = '';
  d.ind.remove();
  document.body.classList.remove('is-dragging');

}
$app.addEventListener('pointerdown', e => {
  const h = e.target.closest('.drag-h');
  if (!h || DRAG || (e.pointerType === 'mouse' && e.button !== 0)) return;
  dragStart(e, h);
});
window.addEventListener(
  'pointermove',
  e => {
    if (DRAG && e.pointerId === DRAG.pid) {
      DRAG.cy = e.clientY;
      dragPaint();
    }
  },
  { passive: true }
);
window.addEventListener('pointerup', e => {
  if (DRAG && e.pointerId === DRAG.pid) dragEnd(true);
});
window.addEventListener('pointercancel', e => {
  if (DRAG && e.pointerId === DRAG.pid) dragEnd(false);
});
// 키보드: 손잡이에 초점을 두고 ↑↓
$app.addEventListener('keydown', e => {
  const h = e.target.closest && e.target.closest('.drag-h');
  if (!h || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  const uid = h.dataset.uid;
  A.move({ uid, n: e.key === 'ArrowUp' ? -1 : 1 });
  const nh = document.querySelector(`.drag-h[data-uid="${uid}"]`);
  if (nh) nh.focus();
});
Object.assign(A, {
  dragTo(d) {
    const p = S.plan,
      items = p.days[S.di].items,
      i = items.findIndex(x => x.uid === d.uid),
      t = Number(d.to);
    if (i < 0 || t === i || t < 0 || t >= items.length) return;
    const before = computeDay(p, S.di);
    pushUndo();
    const [it] = items.splice(i, 1);
    items.splice(t, 0, it);
    items.forEach(x => {
      if (x.fixed) x.fixed = false;

    cleanModes(p, S.di);
    dirty();
    const after = computeDay(p, S.di),
      diff = after.endArr - before.endArr;
    S.reAsk =

        : null;
    render();
    if (!S.reAsk)
      toast(
        L(
          `${itemName(p, it)}을(를) ${t + 1}번째로 옮겼어요.`,
          `「${it.sid ? SPOT[it.sid].j : itemName(p, it)}」を${t + 1}番目に移しました。`
        ),
        true

  }

// nav.js · 안드로이드 뒤로가기
// 뒤로가기를 누르면 앱이 닫히지 않고 바로 전 화면(열린 시트 → 이전 단계 → 홈)으로 가요.
// 고치는 법: docs/수정가이드.md
// ======================================================================
// ---- 안드로이드 뒤로가기: 앱 밖으로 나가지 않고 바로 전 화면으로 ----
// 홈(시트 없음)이 아닌 동안 기록을 한 칸 쌓아 두고, 뒤로가기가 그 칸을 지우면 앱 안에서 한 단계 뒤로 가요.
// 홈에서 누르면 원래대로 앱이 닫혀요.
const NAV = { skip: 0, on: IS_APP && !!(window.history && history.pushState) };
function navAtRoot() {
  return S.view === 'home' && !S.sheet;
}
function navSync() {
  if (!NAV.on || NAV.skip) return;
  const guarded = !!(history.state && history.state.fkNav);
  try {
    if (!navAtRoot() && !guarded) history.pushState({ fkNav: 1 }, '');
    else if (navAtRoot() && guarded) {
      NAV.skip++;
      history.back();
    } // 버튼으로 홈에 왔으면 남은 칸을 치워요
  } catch (e) {
    NAV.on = false;
  }
}
function navBack() {
  if (typeof DRAG !== 'undefined' && DRAG) {

    return;
  }
  const sh = S.sheet;
  if (sh) {
    if (sh.type === 'spot' && sh.back) A.spotBack();
    else if (sh.type === 'hpick' && sh.back) {
      S.sheet = { type: sh.back };
      render();
    } else A.closeSheet();
    return;
  }
  if (S.view === 'plan') {
    if (S.sel) {
      S.sel = null;
      render();
      return;
    }
    if (S.tab !== 'sched') {
      A.tab({ t: 'sched' });
      return;
    }
    A.goHome();
    return;
  }
  if (S.view === 'areas') {
    A.toDates();
    return;
  }
  if (S.view === 'dates') {
    A.goHome();
    return;
  }
}

  if (!NAV.on) return;
  if (NAV.skip) {
    NAV.skip--;
    navSync();
    return;
  }
  if (navAtRoot()) return;
  navBack();
  navSync();
});

// maps.js · 지도 그리기
// 새 여행 2단계 지도(drawRegion), 계획의 지도 탭(drawDay), 걷기 추천 지도(drawWalk)
// 바다·강·지하철 모양 데이터는 data.js 의 GEO 에 있어요.

const C0 = { lat: 33.592, lng: 130.403 };
const REGION_BASE = { x: -400, y: -262, w: 720, h: 468 };
// 시내는 크게·외곽은 작게 보이는 지도 좌표 변환
function fish(lat, lng) {
  const x = (lng - C0.lng) * KX,
    y = (C0.lat - lat) * KY,
    r = Math.hypot(x, y);
  if (r < 1e-6) return [0, 0];
  const f = (Math.log(1 + r / 0.8) / r) * 100;
  return [x * f, y * f];
}
const f1 = v => Math.round(v * 10) / 10;
// 부드러운 곡선 만들기
function smoothSeg(ps, closed) {
  const n = ps.length,
    get = i => (closed ? ps[(i + n) % n] : ps[Math.max(0, Math.min(n - 1, i))]);
  let d = '';
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = get(i - 1),
      p1 = get(i),
      p2 = get(i + 1),
      p3 = get(i + 2);
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)},${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)},${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])},${f1(p2[1])}`;
  }

// 좌표 목록 → 곡선
function pathOf(ps, closed) {

// 바다·섬·공원·강·철도·지하철 그리기
function geoSVG(P, k, o = {}) {
  const pr = arr => arr.map(([la, ln]) => P(la, ln));
  const d2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  let h =
    '<defs><radialGradient id="hillg"><stop offset="0" class="hill-a"/><stop offset="1" class="hill-b"/></radialGradient></defs>';
  GEO.hills.forEach(([la, ln, r]) => {
    const c = P(la, ln),
      rr = d2(c, P(la + r, ln));
    h += `<circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="${f1(rr)}" fill="url(#hillg)"/>`;
  });
  const sea = GEO.sea,
    corners = [sea[0], ...sea.slice(-2)],
    coast = pr(sea.slice(1, -2));
  const c0 = P(...corners[0]),
    cA = P(...corners[1]),
    cB = P(...corners[2]);
  const mid = (a, b) => P((a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
  h += `<path class="sea" d="M${f1(c0[0])},${f1(c0[1])}L${f1(coast[0][0])},${f1(coast[0][1])}${smoothSeg(coast, false)}L${f1(cA[0])},${f1(cA[1])}L${mid(corners[1], corners[2]).map(f1).join(',')}L${f1(cB[0])},${f1(cB[1])}L${mid(corners[2], corners[0]).map(f1).join(',')}Z"/>`;
  h += `<path class="coast" d="M${f1(coast[0][0])},${f1(coast[0][1])}${smoothSeg(coast, false)}"/>`;
  GEO.islands.forEach(isl => {
    h += `<path class="land isl" d="${pathOf(pr(isl), true)}"/>`;
  });
  GEO.parks.forEach(([la, ln, rla, rln]) => {
    const c = P(la, ln);
    h += `<ellipse class="park" cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${f1(d2(c, P(la, ln + rln)))}" ry="${f1(d2(c, P(la + rla, ln)))}"/>`;
  });
  GEO.ponds.forEach(([la, ln, rla, rln]) => {
    const c = P(la, ln);
    h += `<ellipse class="sea" cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${f1(d2(c, P(la, ln + rln)))}" ry="${f1(d2(c, P(la + rla, ln)))}"/>`;
  });
  GEO.rivers.forEach(rv => {
    h += `<path class="river" style="stroke-width:${f1(o.riverW || 2.5 * k)}" d="${pathOf(pr(rv), false)}"/>`;
  });
  GEO.rails.forEach(r => {
    h += `<path class="rail" style="stroke-width:${f1(1.6 * k)};stroke-dasharray:${f1(5 * k)} ${f1(4 * k)}" d="M${pr(
      r.pts
    )
      .map(p => p.map(f1).join(','))
      .join('L')}"/>`;
  });
  Object.values(LINES).forEach(L => {
    h += `<path class="sline" style="stroke:${L.color};stroke-width:${f1((o.lineW || 2.4) * k)}" d="M${L.st.map(s => P(STATIONS[s].lat, STATIONS[s].lng).map(f1).join(',')).join('L')}"/>`;
  });
  if (o.stations) {
    Object.values(STATIONS).forEach(s => {
      const p = P(s.lat, s.lng);
      h += `<g transform="translate(${f1(p[0])},${f1(p[1])}) scale(${k})"><circle class="st" r="3.2"/><text class="st-t" x="6" y="-5">${s.n}</text></g>`;
    });
  }
  if (o.labels)
    GEO.labels.forEach(l => {
      const p = P(l.lat, l.lng);
      h += `<text class="sea-t" x="${f1(p[0])}" y="${f1(p[1])}" style="font-size:${f1(13 * k)}px">${l.t}</text>`;
    });
  return h;
}

  if (!W || !H) return;
  const B = REGION_BASE,
    s = Math.min(W / B.w, H / B.h);
  const base = { w: W / s, h: H / s };
  base.x = B.x + B.w / 2 - base.w / 2;
  base.y = B.y + B.h / 2 - base.h / 2;
  if (!deco) S.mvBase = base;
  const mv = !deco && S.mv ? S.mv : base;
  const k = mv.w / W;
  const sel = deco ? [] : S.draft.areas;
  let h = geoSVG(fish, k, { labels: true, lineW: 2 });
  SPOTS.forEach(sp => {
    if (AREA[sp.a].kind === 'trip') return;
    const p = fish(sp.lat, sp.lng);
    h += `<circle class="sdot${sel.includes(sp.a) ? ' on' : ''}" cx="${f1(p[0])}" cy="${f1(p[1])}" r="${f1(2.6 * k)}"/>`;
  });
  AREAS.filter(a => a.kind !== 'trip').forEach(a => {
    const p = fish(a.lat, a.lng),
      on = sel.includes(a.id);
    const lab = `<text class="apin-t" y="${a.lab === 'up' ? -22 : 31}">${a.n}</text>`;
    h += deco
      ? `<g class="apin deco" transform="translate(${f1(p[0])},${f1(p[1])}) scale(${f1(k * 0.85)})"><circle r="9" class="apin-c"/>${lab}</g>`
      : `<g class="apin${on ? ' on' : ''}" data-act="toggleArea" data-id="${a.id}" tabindex="0" role="button" aria-pressed="${on}" aria-label="${a.n}" transform="translate(${f1(p[0])},${f1(p[1])}) scale(${f1(k)})"><circle r="22" class="apin-hit"/><circle r="15" class="apin-c"/>${on ? '<path class="apin-k" d="M-6 0l4 4 8-9"/>' : '<circle r="4" class="apin-d"/>'}${lab}</g>`;
  });
  if (!deco) h += draftHotelPins(k);
  el.innerHTML = `<svg viewBox="${f1(mv.x)} ${f1(mv.y)} ${f1(mv.w)} ${f1(mv.h)}" role="img" aria-label="후쿠오카 안내 지도"${deco ? '' : ' class="pan"'}>${h}</svg>`;
  if (!deco) enablePan(el.querySelector('svg'), W);
}
// 새 여행 2단계 지도: 1단계에서 고른 숙소 자리에 핀 (같은 자리면 하나로 합쳐요)
function draftHotelStays() {
  const D = S.draft;
  if (!D || !D.start || !D.end) return [];
  return normStays(D.stays, draftNights(), D.hotel);
}
// 2단계 지도의 숙소 핀
function draftHotelPins(k) {
  const st = draftHotelStays();
  if (!st.length) return '';
  const multi = st.length > 1,
    groups = new Map();
  st.forEach((x, i) => {
    const pt = hotelPt(x.h),
      key = `${pt.lat.toFixed(4)},${pt.lng.toFixed(4)}`;
    if (!groups.has(key)) groups.set(key, { pt, n: [] });
    groups.get(key).n.push(i + 1);
  });
  let h = '';
  groups.forEach(g => {
    const p = fish(g.pt.lat, g.pt.lng),
      lab = multi ? L(`숙소 ${g.n.join('·')}`, `宿${g.n.join('・')}`) : L('내 숙소', '宿');
    h += `<g class="hpin" transform="translate(${f1(p[0])},${f1(p[1])}) scale(${f1(k)})" aria-hidden="true">
      <path class="hpin-b" d="M0 0C-4 -7 -12 -11 -12 -19a12 12 0 1 1 24 0c0 8 -8 12 -12 19z"/>
      <svg x="-7.5" y="-26.5" width="15" height="15" viewBox="0 0 24 24" class="hpin-ic">${ICON.home}</svg>
      <text class="hpin-t" x="15" y="-14">${esc(lab)}</text></g>`;
  });
  return h;
}
// 확대한 지도 손가락으로 끌기
function enablePan(svg, W) {
  let st = null;
  svg.addEventListener('pointerdown', e => {
    if (!S.mv) return;
    st = { x: e.clientX, y: e.clientY, mv: { ...S.mv }, moved: false };
  });
  svg.addEventListener('pointermove', e => {
    if (!st) return;
    const dx = e.clientX - st.x,
      dy = e.clientY - st.y;
    if (!st.moved && Math.hypot(dx, dy) < 5) return;
    if (!st.moved) {
      st.moved = true;
      try {
        svg.setPointerCapture(e.pointerId);
      } catch (_) {}
    }
    const k = st.mv.w / W,
      b = S.mvBase;
    const x = clamp(st.mv.x - dx * k, b.x - b.w * 0.2, b.x + b.w * 1.2 - st.mv.w),
      y = clamp(st.mv.y - dy * k, b.y - b.h * 0.2, b.y + b.h * 1.2 - st.mv.h);
    S.mv = { ...st.mv, x, y };
    svg.setAttribute('viewBox', `${f1(x)} ${f1(y)} ${f1(st.mv.w)} ${f1(st.mv.h)}`);
  });
  const end = e => {
    if (st && st.moved) {
      svg.addEventListener('click', ev => ev.stopPropagation(), { capture: true, once: true });
    }
    st = null;
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', () => {
    st = null;
  });
}
// 일반 지도 좌표 변환 (일차 지도용)
function linear(ptsIn, W, H, pad, minKm = 1.2) {
  let la0 = Infinity,
    la1 = -Infinity,
    ln0 = Infinity,
    ln1 = -Infinity;
  ptsIn.forEach(p => {
    la0 = Math.min(la0, p.lat);
    la1 = Math.max(la1, p.lat);
    ln0 = Math.min(ln0, p.lng);
    ln1 = Math.max(ln1, p.lng);
  });
  let sx = (ln1 - ln0) * KX,
    sy = (la1 - la0) * KY;
  const cx = (ln0 + ln1) / 2,
    cy = (la0 + la1) / 2;
  sx = Math.max(sx, minKm);
  sy = Math.max(sy, minKm * 0.6);
  const s = Math.min((W - pad * 2) / sx, (H - pad * 2) / sy);
  const P = (lat, lng) => [W / 2 + (lng - cx) * KX * s, H / 2 - (lat - cy) * KY * s];
  return { P, s };
}
const SEG_STYLE = {
  walk: 'stroke-dasharray:0.1 7;stroke-linecap:round;stroke-width:4.5',
  subway: 'stroke-width:4.5',
  bus: 'stroke-width:4;stroke-dasharray:10 5',
  taxi: 'stroke-width:3.5;stroke-dasharray:4 4',
  car: 'stroke-width:3.5;stroke-dasharray:4 4',
  train: 'stroke-width:4.5;stroke-dasharray:14 4',
  ferry: 'stroke-width:4;stroke-dasharray:2 6;stroke-linecap:round',
  none: ''
};
// 이동 선 그리기
function segPath(seg, P) {
  return 'M' + seg.pts.map(p => P(p.lat, p.lng).map(f1).join(',')).join('L');
}
// 출발·도착(숙소·공항) 핀
function anchorPin(P, pt, icon, label) {
  const [x, y] = P(pt.lat, pt.lng);
  return `<g class="anc-pin" transform="translate(${f1(x)},${f1(y)})"><rect x="-13" y="-13" width="26" height="26" rx="7"/><svg x="-8" y="-8" width="16" height="16" viewBox="0 0 24 24" class="anc-ic">${ICON[icon]}</svg><title>${esc(label)}</title></g>`;
}
// ★ 계획의 지도 탭 (그날 동선)
function drawDay(el) {
  const W = el.clientWidth,
    H = el.clientHeight;
  if (!W || !H) return;
  const p = S.plan,
    c = computeDay(p, S.di),
    day = c.day;
  const legs = [...c.rows.map(r => r.leg), c.endLeg];
  let pts = [c.startPt, ...c.rows.map(r => r.p), c.endPt];
  const spanKm = pts2 => {
    const la = pts2.map(x => x.lat),
      ln = pts2.map(x => x.lng);
    return Math.max((Math.max(...ln) - Math.min(...ln)) * KX, (Math.max(...la) - Math.min(...la)) * KY);
  };
  let note = '';
  if (c.rows.length && spanKm(pts) > 28) {
    const zc = {};
    c.rows.forEach(r => (zc[r.p.z] = (zc[r.p.z] || 0) + 1));
    const z = Object.entries(zc).sort((a, b) => b[1] - a[1])[0][0];
    pts = c.rows.filter(r => r.p.z === z).map(r => r.p);
    note = `<p class="map-note2">${ZONES[z]} 주변을 보여 주고 있어요. 숙소·공항 쪽 이동은 지도 밖으로 이어져요.</p>`;
  }
  const { P, s } = linear(pts, W, H, 42);
  let h = geoSVG(P, 1, { stations: s > 120, riverW: clamp(s * 0.05, 1.5, 6), lineW: 2.2 });
  legs.forEach(l =>
    (l.segs || []).forEach(sg => {
      h += `<path class="seg-halo" d="${segPath(sg, P)}"/><path class="rseg" style="stroke:${sg.mode === 'subway' && sg.line ? LINES[sg.line].color : MODE[sg.mode].color};${SEG_STYLE[sg.mode] || ''}" d="${segPath(sg, P)}"/>`;
    })
  );
  const sameAnchor = km(c.startPt, c.endPt) < 0.05;
  h += anchorPin(P, c.startPt, day.start.kind === 'airport' ? 'plane' : 'home', '출발');
  if (!sameAnchor) h += anchorPin(P, c.endPt, day.end.kind === 'airport' ? 'plane' : 'home', '도착');
  c.rows.forEach((r, i) => {
    const [x, y] = P(r.p.lat, r.p.lng),
      on = S.sel === r.it.uid;
    h += `<g class="npin${on ? ' on' : ''}${r.it.src === 'walk' ? ' walkp' : ''}" data-act="mapPick" data-uid="${r.it.uid}" transform="translate(${f1(x)},${f1(y)})" tabindex="0" role="button" aria-label="${i + 1}. ${esc(itemName(p, r.it))}"><circle r="${on ? 15 : 12}"/><text y="4.5">${i + 1}</text>${on ? `<text class="npin-l" y="-22">${esc(itemName(p, r.it))}</text>` : ''}</g>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${S.di + 1}일차 동선 지도">${h}</svg>${note}`;
}
// 걷기 추천 지도
function drawWalk(el) {
  const sh = S.sheet;
  if (!sh || !sh.recs || sh.recs.err) return;
  const W = el.clientWidth,
    H = el.clientHeight;
  if (!W || !H) return;
  const R = sh.recs,
    pts = [R.A, R.B, ...R.recs.map(r => r.s)];
  const { P, s } = linear(pts, W, H, 34, 0.8);
  let h = geoSVG(P, 1, { stations: s > 160, riverW: clamp(s * 0.05, 1.5, 6), lineW: 2 });
  const a = P(R.A.lat, R.A.lng),
    b = P(R.B.lat, R.B.lng);
  h += `<path class="corr" style="stroke-width:${f1(R.corridor * 2 * s)}" d="M${a.map(f1).join(',')}L${b.map(f1).join(',')}"/>`;
  h += `<path class="rseg" style="stroke:${MODE.walk.color};${SEG_STYLE.walk}" d="M${a.map(f1).join(',')}L${b.map(f1).join(',')}"/>`;
  R.recs.forEach((r, k) => {
    const [x, y] = P(r.s.lat, r.s.lng),
      on = sh.picks.includes(r.s.id);
    h += `<g class="rpin${on ? ' on' : ''}" data-act="recToggle" data-id="${r.s.id}" transform="translate(${f1(x)},${f1(y)})"><circle r="11"/><text y="4">${k + 1}</text></g>`;
  });
  [
    [a, '출발'],
    [b, '도착']
  ].forEach(([p, t]) => {
    h += `<g class="ab-pin" transform="translate(${f1(p[0])},${f1(p[1])})"><rect x="-17" y="-11" width="34" height="22" rx="11"/><text y="4">${t}</text></g>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="걷는 길 추천 지도">${h}</svg>`;
}

applyLang();
startTr();
render();
store.init();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
