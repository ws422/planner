<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F3ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1424" media="(prefers-color-scheme: dark)">
<meta name="description" content="후쿠오카 여행 일정·동선·교통비를 짜 주는 플래너">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="후쿠오카">
<title>후쿠오카 여행 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;800&family=Nanum+Myeongjo:wght@700;800&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ==================================================================
   style.css · 디자인 (색·글꼴·간격·모양)
   맨 위 :root 의 --이름 값이 앱 전체 색이에요. 다크 모드 색은 그 아래 @media (prefers-color-scheme: dark) 에 있어요.
   고치는 법: docs/수정가이드.md
   ================================================================== */
/* 후쿠오카 플래너 v3: 따뜻한 종이색 바탕 + 하카타만 남색 + 도리이 주홍 포인트. 홈 상단은 모모치 해변의 후쿠오카 타워 그림, 곳곳에 하카타오리(五色献上) 줄무늬 */
:root {
  --outer: #e9e4db;
  --bg: #f7f3ed;
  --surface: #ffffff;
  --surface-2: #f1ece4;
  --surface-3: #e5ded3;
  --ink: #15203a;
  --ink-2: #5a6175;
  --ink-3: #8f95a3;
  --line: #e8e2d8;
  --pri: #d63a1f;
  --pri-2: #fbe7e1;
  --pri-ink: #ffffff;
  --pink: #c2335e;
  --blue: #2459c9;
  --blue-2: #e8effc;
  --ok: #1d8a55;
  --ok-2: #e3f4ea;
  --warn: #a86500;
  --warn-2: #fff2d9;
  --bad: #d33539;
  --bad-2: #fceaea;
  --sea: #cfe1ec;
  --sea-edge: #a6c4d8;
  --land: #fbf8f2;
  --park: #d8eacd;
  --hill-a: #e7e9d8;
  --hill-b: rgba(231, 233, 216, 0);
  --river: #afcfe2;
  --rail: #a7adb6;
  --font: 'Gothic A1', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --serif: 'Nanum Myeongjo', 'AppleMyungjo', 'Noto Serif KR', serif;
  --num: 'Outfit', 'Gothic A1', sans-serif;
  --r: 22px;
  --sh: 0 1px 2px rgba(21, 32, 58, 0.05), 0 6px 18px rgba(21, 32, 58, 0.07);
  --grad: linear-gradient(135deg, #f07a3a 0%, #d63a1f 52%, #a82a55 100%);
  --obi: repeating-linear-gradient(
    90deg,
    #15203a 0 5px,
    #d63a1f 5px 10px,
    #d9962b 10px 15px,
    #6b3e8e 15px 20px,
    #2459c9 20px 25px
  );
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --outer: #05080f;
    --bg: #0e1424;
    --surface: #172036;
    --surface-2: #1f2942;
    --surface-3: #29344f;
    --ink: #eef1f7;
    --ink-2: #a8b0c2;
    --ink-3: #747d96;
    --line: #27324b;
    --pri: #f2573c;
    --pri-2: #3a1d17;
    --pink: #f0628b;
    --blue: #7ea2ff;
    --blue-2: #1a2546;
    --ok: #4acb8a;
    --ok-2: #14301f;
    --warn: #f0b55a;
    --warn-2: #33280f;
    --bad: #ff7a7e;
    --bad-2: #3a1a1c;
    --sea: #12324a;
    --sea-edge: #23506f;
    --land: #182235;
    --park: #1b3a2a;
    --hill-a: #1e2b33;
    --hill-b: rgba(30, 43, 51, 0);
    --river: #23506f;
    --rail: #5a6878;
    --sh: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.28);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --outer: #05080f;
  --bg: #0e1424;
  --surface: #172036;
  --surface-2: #1f2942;
  --surface-3: #29344f;
  --ink: #eef1f7;
  --ink-2: #a8b0c2;
  --ink-3: #747d96;
  --line: #27324b;
  --pri: #f2573c;
  --pri-2: #3a1d17;
  --pink: #f0628b;
  --blue: #7ea2ff;
  --blue-2: #1a2546;
  --ok: #4acb8a;
  --ok-2: #14301f;
  --warn: #f0b55a;
  --warn-2: #33280f;
  --bad: #ff7a7e;
  --bad-2: #3a1a1c;
  --sea: #12324a;
  --sea-edge: #23506f;
  --land: #182235;
  --park: #1b3a2a;
  --hill-a: #1e2b33;
  --hill-b: rgba(30, 43, 51, 0);
  --river: #23506f;
  --rail: #5a6878;
  --sh: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.28);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html,
body {
  margin: 0;
}
body {
  background: var(--outer);
  color: var(--ink);
  font: 15px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
body.locked {
  overflow: hidden;
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
}
:focus-visible {
  outline: 2.5px solid var(--pri);
  outline-offset: 2px;
  border-radius: 10px;
}
.ic {
  width: 20px;
  height: 20px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
h1,
h2,
h3 {
  margin: 0;
  text-wrap: balance;
}
small {
  font-size: 12.5px;
}

.shell {
  position: relative;
  max-width: 520px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--bg);
}
@media (min-width: 560px) {
  .shell {
    box-shadow:
      0 0 0 1px var(--line),
      0 20px 60px rgba(20, 27, 45, 0.08);
  }
}
.scr {
  padding: 8px 18px 120px;
}

/* 상단 바 */
.appbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
  min-height: 58px;
  padding: 8px 12px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 17px;
  letter-spacing: -0.02em;
  padding-left: 6px;
}
.logo2 {
  width: 26px;
  height: 26px;
  flex: none;
}
.ab-t {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  font-weight: 800;
  font-size: 16px;
}
.ab-t small {
  font-weight: 500;
  color: var(--ink-2);
}
.ab-title {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 800;
  font-size: 16px;
  max-width: 100%;
}
.ab-title .ic {
  width: 14px;
  height: 14px;
  color: var(--ink-3);
}
.ab-r {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
  min-width: 40px;
}
.ab-sp {
  display: block;
}
.ib {
  display: inline-grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 14px;
  color: var(--ink);
  background: transparent;
}
.ib:hover {
  background: var(--surface-2);
}
.ib.sm {
  width: 36px;
  height: 36px;
  border-radius: 12px;
}
.ib.xs {
  width: 28px;
  height: 28px;
  border-radius: 9px;
}
.ib.xs .ic {
  width: 16px;
  height: 16px;
}
.ib:disabled {
  opacity: 0.3;
  cursor: default;
}
.savebtn {
  height: 36px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--pri);
  color: var(--pri-ink);
  font-weight: 700;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.savebtn .ic {
  width: 16px;
  height: 16px;
  stroke-width: 2.6;
}
.savebtn.done {
  background: var(--surface-2);
  color: var(--ok);
}
.prog {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 0 18px 6px;
  position: sticky;
  top: 58px;
  z-index: 29;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
}
.prog i {
  height: 4px;
  border-radius: 4px;
  background: var(--surface-3);
}
.prog i.on {
  background: var(--pri);
}

/* 버튼 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 15px;
  font-weight: 700;
  font-size: 15px;
  transition:
    transform 0.12s,
    filter 0.15s;
  white-space: nowrap;
}
.btn:active:not(:disabled) {
  transform: scale(0.98);
}
.btn.pri {
  background: var(--pri);
  color: var(--pri-ink);
  box-shadow: 0 6px 16px color-mix(in srgb, var(--pri) 26%, transparent);
}
.btn.pri:hover:not(:disabled) {
  filter: brightness(1.05);
}
.btn.pri:disabled {
  background: var(--surface-3);
  color: var(--ink-3);
  cursor: not-allowed;
  box-shadow: none;
}
.btn.big {
  min-height: 56px;
  width: 100%;
  font-size: 17px;
  border-radius: 20px;
}
.btn.big .ic {
  width: 22px;
  height: 22px;
}
.btn.soft {
  background: var(--surface-2);
  color: var(--ink);
}
.btn.soft:hover {
  background: var(--surface-3);
}
.btn.ghost {
  background: transparent;
  color: var(--ink-2);
}
.btn.sm {
  min-height: 34px;
  padding: 0 12px;
  font-size: 13.5px;
  border-radius: 11px;
}
.btn .ic {
  width: 18px;
  height: 18px;
}
.btn.danger {
  color: var(--bad);
}
.btn.danger-fill {
  background: var(--bad);
}
.row2 {
  display: flex;
  gap: 8px;
}
.row2 > .btn {
  flex: 1;
}
.cta {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(520px, 100%);
  z-index: 25;
  padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  display: grid;
  gap: 10px;
}

/* 공통 */
.card {
  background: var(--surface);
  border-radius: var(--r);
  padding: 16px;
  box-shadow: var(--sh);
}
.card + .card {
  margin-top: 12px;
}
.sec {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 16px;
  font-weight: 800;
  margin: 28px 2px 12px;
}
.sec::before {
  content: '';
  align-self: center;
  flex: none;
  width: 4px;
  height: 15px;
  border-radius: 2px;
  background: var(--pri);
}
.sec small {
  font-size: 12.5px;
  color: var(--ink-3);
  font-weight: 600;
  margin-left: auto;
}
.sub {
  color: var(--ink-2);
  font-size: 13.5px;
  margin: 4px 0 12px;
}
.h-xl {
  font-family: var(--serif);
  font-size: clamp(30px, 8vw, 36px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.22;
}
.h-l {
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 6px 2px 16px;
}
.h-s {
  font-size: 16px;
  font-weight: 800;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12.5px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-2);
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-2);
  white-space: nowrap;
}
.tag .ic {
  width: 12px;
  height: 12px;
  stroke-width: 3;
}
.tag.meal {
  background: var(--pri-2);
  color: var(--pri);
}
.tag.walk {
  background: var(--ok-2);
  color: var(--ok);
}
.tag.fast {
  background: var(--blue-2);
  color: var(--blue);
}
.tag.cheap {
  background: var(--ok-2);
  color: var(--ok);
}
.store-note {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--ink-3);
  font-size: 12.5px;
  margin: 22px 0 0;
}
.store-note .ic {
  width: 14px;
  height: 14px;
}
.fine {
  font-size: 12px;
  color: var(--ink-3);
  margin: 18px 4px 0;
}
.note {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px 14px;
  border-radius: 16px;
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 14px;
  margin: 12px 0 0;
}
.note > span {
  flex: 1;
  min-width: 160px;
}
.note.bad {
  background: var(--bad-2);
  color: var(--bad);
}
.note.ok {
  background: var(--ok-2);
  color: var(--ok);
}
.warn-t {
  color: var(--warn) !important;
  font-weight: 700;
}
.bad-t {
  color: var(--bad);
}

/* 카테고리 타일 */
.ct {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 11px;
  flex: none;
  background: var(--surface-2);
  color: var(--ink-2);
}
.ct .ic {
  width: 18px;
  height: 18px;
}
.c-sight {
  --c: #3e63dd;
}
.c-food {
  --c: #e5484d;
}
.c-cafe {
  --c: #a35829;
}
.c-shop {
  --c: #8e4ec6;
}
.c-nature {
  --c: #2b9a66;
}
.c-onsen {
  --c: #e2780f;
}
.c-free {
  --c: #6f7a8b;
}
.c-bed {
  --c: #6f7a8b;
}
.ct[class*='c-'] {
  background: color-mix(in srgb, var(--c) 13%, var(--surface));
  color: var(--c);
}
.chip[class*='c-'] {
  background: color-mix(in srgb, var(--c) 12%, var(--surface));
  color: var(--c);
}

/* 기간 */
.sel-sum {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border-radius: 18px;
  padding: 14px 16px;
  box-shadow: var(--sh);
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.sel-sum > div {
  display: flex;
  flex-direction: column;
}
.sel-sum small {
  color: var(--ink-3);
}
.sel-sum b {
  font-size: 15.5px;
}
.sel-sum > .ic {
  color: var(--ink-3);
}
.sel-sum .pill {
  margin-left: auto;
  background: var(--pri);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  padding: 5px 12px;
  border-radius: 999px;
}
.cal-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.cal-h b {
  font-family: var(--num);
  font-size: 17px;
}
.wk,
.grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}
.wk span {
  text-align: center;
  font-size: 12px;
  color: var(--ink-3);
  padding: 4px 0 8px;
}
.dc {
  height: 44px;
  display: grid;
  place-items: center;
  font-family: var(--num);
  font-weight: 500;
  font-size: 15.5px;
  position: relative;
}
.dc span {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  position: relative;
  z-index: 1;
}
.dc:hover:not(:disabled) span {
  background: var(--surface-2);
}
.dc.sun {
  color: var(--bad);
}
.dc.sat {
  color: var(--blue);
}
.dc.past {
  opacity: 0.3;
  cursor: default;
}
.dc.today span::after {
  content: '';
  position: absolute;
  bottom: 4px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--pri);
}
.dc.in {
  background: var(--pri-2);
}
.dc.rs {
  background: linear-gradient(to right, transparent 50%, var(--pri-2) 50%);
}
.dc.re {
  background: linear-gradient(to left, transparent 50%, var(--pri-2) 50%);
}
.dc.s span,
.dc.e span {
  background: var(--pri) !important;
  color: #fff;
  font-weight: 700;
}
.hint-s {
  color: var(--ink-3);
  font-size: 13px;
  text-align: center;
  margin: 10px 0 0;
}
.chips-sel {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chips-sel.scroll {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 12px -18px 4px;
  padding: 0 18px;
}
.chips-sel button {
  padding: 9px 16px;
  border-radius: 999px;
  background: var(--surface-2);
  font-weight: 700;
  font-size: 14px;
  color: var(--ink-2);
  white-space: nowrap;
}
.chips-sel button.on {
  background: var(--ink);
  color: var(--bg);
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 10px;
}
.fld {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12.5px;
  color: var(--ink-2);
  font-weight: 700;
}
.fld select,
.fld input,
.ed select,
.ed input {
  min-height: 46px;
  border-radius: 14px;
  border: 0;
  background: var(--surface-2);
  padding: 0 12px;
  color: var(--ink);
  font-weight: 600;
  font-size: 15px;
  width: 100%;
}

/* 지역 */
.map-card {
  position: relative;
  background: var(--surface);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: var(--sh);
}
.rmap {
  width: 100%;
  height: 330px;
  background: var(--land);
  touch-action: none;
}
.rmap svg {
  display: block;
  width: 100%;
  height: 100%;
}
.map-ctl {
  position: absolute;
  top: 10px;
  right: 10px;
  display: grid;
  gap: 6px;
}
.map-ctl .ib {
  background: var(--surface);
  box-shadow: var(--sh);
}
.map-cap {
  margin: 0;
  padding: 10px 14px 12px;
  font-size: 12.5px;
  color: var(--ink-3);
}
.agrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.acard {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  text-align: left;
  padding: 14px 14px 12px;
  border-radius: 18px;
  background: var(--surface);
  box-shadow: var(--sh);
  border: 2px solid transparent;
  transition: border-color 0.15s;
}
.acard b {
  font-size: 15.5px;
  padding-right: 26px;
}
.acard small {
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.4;
}
.ac-m {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-3);
}
.ac-k {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
}
.ac-k .ic {
  width: 14px;
  height: 14px;
  stroke-width: 3;
}
.acard.on {
  border-color: var(--pri);
  background: color-mix(in srgb, var(--pri-2) 55%, var(--surface));
}
.acard.on .ac-k {
  background: var(--pri);
  border-color: var(--pri);
  color: #fff;
}
.meter {
  background: var(--surface);
  border-radius: 16px;
  padding: 10px 14px;
  box-shadow: var(--sh);
}
.m-t {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 13.5px;
}
.m-t span {
  color: var(--ink-2);
}
.bar {
  height: 6px;
  border-radius: 6px;
  background: var(--surface-3);
  margin-top: 8px;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  border-radius: 6px;
  background: var(--ok);
  transition: width 0.25s;
}
.bar i.over {
  background: var(--warn);
}

/* 지도 공통 */
.sea {
  fill: var(--sea);
}
.coast {
  fill: none;
  stroke: var(--sea-edge);
  stroke-width: 1.2;
}
.land {
  fill: var(--land);
  stroke: var(--sea-edge);
  stroke-width: 1;
}
.park {
  fill: var(--park);
}
.hill-a {
  stop-color: var(--hill-a);
}
.hill-b {
  stop-color: var(--hill-b);
}
.river {
  fill: none;
  stroke: var(--river);
  stroke-linecap: round;
}
.rail {
  fill: none;
  stroke: var(--rail);
}
.sline {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.5;
}
.st {
  fill: var(--surface);
  stroke: var(--ink-3);
  stroke-width: 1.4;
}
.st-t {
  font-size: 10px;
  fill: var(--ink-3);
  paint-order: stroke;
  stroke: var(--land);
  stroke-width: 3px;
}
.sea-t {
  fill: color-mix(in srgb, var(--sea-edge) 60%, var(--ink-3));
  font-weight: 700;
  letter-spacing: 0.35em;
  text-anchor: middle;
}
.sdot {
  fill: var(--ink-3);
  opacity: 0.4;
}
.sdot.on {
  fill: var(--pri);
  opacity: 0.85;
}
.apin {
  cursor: pointer;
  outline: none;
}
.apin-hit {
  fill: transparent;
}
.apin-c {
  fill: var(--surface);
  stroke: var(--ink);
  stroke-width: 2.5;
}
.apin-d {
  fill: var(--ink);
}
.apin-k {
  fill: none;
  stroke: #fff;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.apin-t {
  font-size: 13px;
  font-weight: 800;
  text-anchor: middle;
  fill: var(--ink);
  paint-order: stroke;
  stroke: var(--land);
  stroke-width: 4px;
  stroke-linejoin: round;
}
.apin:hover .apin-c,
.apin:focus-visible .apin-c {
  stroke: var(--pri);
  stroke-width: 3.5;
}
.apin.on .apin-c {
  fill: var(--pri);
  stroke: var(--pri);
}
.rseg {
  fill: none;
  stroke-linejoin: round;
}
.seg-halo {
  fill: none;
  stroke: var(--land);
  stroke-width: 8;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.9;
}
.npin {
  cursor: pointer;
  outline: none;
}
.npin circle {
  fill: var(--ink);
  stroke: var(--surface);
  stroke-width: 2.5;
}
.npin text {
  fill: var(--bg);
  font-family: var(--num);
  font-size: 12px;
  font-weight: 700;
  text-anchor: middle;
}
.npin.walkp circle {
  fill: var(--ok);
}
.npin.on circle {
  fill: var(--pri);
}
.npin.on text {
  fill: #fff;
}
.npin .npin-l {
  fill: var(--ink);
  font-family: var(--font);
  font-size: 13px;
  paint-order: stroke;
  stroke: var(--land);
  stroke-width: 4px;
}
.anc-pin rect {
  fill: var(--surface);
  stroke: var(--ink);
  stroke-width: 2;
}
.anc-ic {
  fill: none;
  stroke: var(--ink);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.corr {
  fill: none;
  stroke: var(--ok);
  opacity: 0.1;
  stroke-linecap: round;
}
.rpin {
  cursor: pointer;
}
.rpin circle {
  fill: var(--surface);
  stroke: var(--ok);
  stroke-width: 2.5;
}
.rpin text {
  font-family: var(--num);
  font-size: 11.5px;
  font-weight: 700;
  text-anchor: middle;
  fill: var(--ok);
}
.rpin.on circle {
  fill: var(--pri);
  stroke: var(--pri);
}
.rpin.on text {
  fill: #fff;
}
.ab-pin rect {
  fill: var(--ink);
}
.ab-pin text {
  fill: var(--bg);
  font-size: 11.5px;
  font-weight: 700;
  text-anchor: middle;
}

/* 계획 */
.days {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -18px;
  padding: 4px 18px 12px;
  position: sticky;
  top: 58px;
  z-index: 20;
  background: var(--bg);
}
.days::-webkit-scrollbar,
.chips-sel.scroll::-webkit-scrollbar,
.strip::-webkit-scrollbar {
  display: none;
}
.days button {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 16px;
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--sh);
  min-width: 84px;
}
.days b {
  font-size: 14px;
}
.days small {
  font-family: var(--num);
  color: var(--ink-3);
  font-size: 12px;
}
.days button.on {
  background: var(--ink);
  color: var(--bg);
}
.days button.on small {
  color: color-mix(in srgb, var(--bg) 70%, transparent);
}
.daycard {
  position: relative;
  background: var(--surface);
  border-radius: 24px;
  padding: 18px 16px 14px;
  box-shadow: var(--sh);
  overflow: hidden;
}
.daycard::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 4px;
  background: var(--obi);
  opacity: 0.85;
}
.dc-h {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.dc-h h2 {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 800;
}
.dc-h small {
  color: var(--ink-2);
}
.dc-h .ib {
  background: var(--surface-2);
}
.stats > * {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  text-align: center;
}
.stats small {
  color: var(--ink-3);
  font-size: 12px;
}
.stats b {
  font-family: var(--num);
  font-weight: 700;
  font-size: 16px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.stats b {
  font-size: 15px;
}
.stats button b {
  color: var(--pri);
}
.hint {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 13px;
  color: var(--ink-2);
  background: var(--surface);
  border-radius: 16px;
  padding: 12px 10px 12px 14px;
  margin-top: 12px;
  box-shadow: var(--sh);
}
.hint > .ic {
  color: var(--ok);
  margin-top: 1px;
}
.hint b {
  color: var(--ink);
}
.banner {
  background: var(--surface);
  border-radius: 20px;
  padding: 14px 16px;
  margin-top: 12px;
  box-shadow:
    0 0 0 2px var(--ok),
    var(--sh);
}
.bn-h {
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--ok);
}
.bn-h b {
  color: var(--ink);
}
.banner ul {
  list-style: none;
  margin: 10px 0 12px;
  padding: 0;
  display: grid;
  gap: 6px;
  font-size: 14px;
}
.banner li {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.banner li b {
  margin-right: 4px;
}
.dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink-3);
  margin-top: 7px;
}
.dot.d-ok {
  background: var(--ok);
}
.dot.d-warn {
  background: var(--warn);
}

.tl {
  list-style: none;
  margin: 16px 0 0;
  padding: 0;
}
.tl > li {
  display: grid;
  grid-template-columns: 50px minmax(0, 1fr);
  column-gap: 10px;
}
.tm {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  padding-top: 14px;
  font-family: var(--num);
}
.tm b {
  font-size: 16px;
  font-weight: 700;
}
.tm span {
  font-size: 12px;
  color: var(--ink-3);
}
.anc .tm {
  padding-top: 11px;
}
.anc-c {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  width: 100%;
  padding: 10px 14px;
  border-radius: 16px;
  background: var(--surface-2);
  font-weight: 700;
  font-size: 14px;
}
.anc-c > span {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.anc-c small {
  color: var(--ink-2);
  font-weight: 500;
}
.anc-c .chev {
  color: var(--ink-3);
  width: 16px;
  height: 16px;
}
.leg {
  min-height: 50px;
}
.leg .rail {
  grid-column: 1;
  justify-self: end;
  width: 0;
  margin-right: 18px;
  border-left: 3px solid var(--m);
  min-height: 100%;
}
.leg.m-walk .rail {
  border-left-style: dotted;
  border-left-width: 4px;
}
.leg.m-bus .rail,
.leg.m-taxi .rail,
.leg.m-car .rail,
.leg.m-ferry .rail {
  border-left-style: dashed;
}
.leg.none .rail {
  border-left: 2px dotted var(--line);
  min-height: 14px;
}
.lchip {
  grid-column: 2;
  align-self: center;
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-areas: 'i m c' 'i l c';
  column-gap: 10px;
  align-items: center;
  width: 100%;
  text-align: left;
  margin: 6px 0;
  padding: 7px 10px 7px 7px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--m) 8%, var(--bg));
  border: 1px solid color-mix(in srgb, var(--m) 18%, transparent);
}
.lchip .mi {
  grid-area: i;
}
.lc-m {
  grid-area: m;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 14px;
}
.lc-m em {
  font-style: normal;
  font-family: var(--num);
  font-weight: 700;
  color: var(--ink);
  background: var(--surface);
  border-radius: 8px;
  padding: 0 7px;
  font-size: 13px;
}
.lc-m .mine {
  font-style: normal;
  font-size: 11px;
  font-weight: 700;
  color: var(--pri);
}
.lc-l {
  grid-area: l;
  font-size: 12.5px;
  color: var(--ink-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lchip .chev {
  grid-area: c;
  width: 16px;
  height: 16px;
  color: var(--ink-3);
}
.mi {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--m);
  color: #fff;
  flex: none;
}
.mi .ic {
  width: 20px;
  height: 20px;
  stroke-width: 2.2;
}
.mi.sm {
  width: 30px;
  height: 30px;
  border-radius: 10px;
}
.mi.sm .ic {
  width: 17px;
  height: 17px;
}
.mi.xs {
  width: 22px;
  height: 22px;
  border-radius: 7px;
}
.mi.xs .ic {
  width: 13px;
  height: 13px;
}
.sc {
  background: var(--surface);
  border-radius: 20px;
  padding: 12px 14px 14px;
  box-shadow: var(--sh);
  border: 2px solid transparent;
  transition: border-color 0.15s;
}
.stop.sel .sc {
  border-color: var(--ink);
}
.sc-hit {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
}
.sc-hit .ct {
  width: 42px;
  height: 42px;
  border-radius: 14px;
}
.sc-hit .ct .ic {
  width: 22px;
  height: 22px;
}
.sc-t {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.sc-t b {
  font-size: 16.5px;
  font-weight: 800;
  line-height: 1.3;
}
.sc-t small {
  color: var(--ink-3);
  font-size: 12.5px;
}
.num {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--ink-2);
  font-family: var(--num);
  font-weight: 700;
  font-size: 12.5px;
  flex: none;
}
.stop.sel .num {
  background: var(--pri);
  color: #fff;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 10px 0 0;
}
.desc {
  margin: 8px 0 0;
  font-size: 13.5px;
  color: var(--ink-2);
}
.warn {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 8px 0 0;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--warn);
  background: var(--warn-2);
  padding: 6px 10px;
  border-radius: 10px;
}
.warn .ic {
  width: 15px;
  height: 15px;
}
.memo {
  margin: 8px 0 0;
  font-size: 13px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--surface-2);
}
.edit {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  display: grid;
  gap: 12px;
}
.ed {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink-2);
}
.ed.col {
  flex-direction: column;
  align-items: stretch;
}
.ed select {
  width: auto;
  min-height: 40px;
  font-size: 14px;
}
.stp {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stp button {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--surface-2);
  color: var(--ink);
}
.stp button:disabled {
  opacity: 0.35;
}
.stp b {
  font-family: var(--num);
  min-width: 72px;
  text-align: center;
  color: var(--ink);
}
.empty-c {
  text-align: center;
}
.empty-c p {
  margin: 4px 0 10px;
  color: var(--ink-2);
}
.day-act {
  margin-top: 16px;
}
.parked {
  margin-top: 16px;
  padding: 0;
}
.parked summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  cursor: pointer;
}
.parked summary::-webkit-details-marker {
  display: none;
}
.parked summary b {
  flex: 1;
}
.parked summary .chev {
  color: var(--ink-3);
  transition: transform 0.2s;
}
.parked[open] summary .chev {
  transform: rotate(180deg);
}
.cnt {
  font-family: var(--num);
  font-weight: 700;
  font-size: 12.5px;
  background: var(--pri);
  color: #fff;
  border-radius: 999px;
  padding: 1px 9px;
}
.parked .sub {
  padding: 0 16px;
  margin-top: 0;
}
.parked ul {
  list-style: none;
  margin: 0;
  padding: 0 8px 10px 16px;
}
.parked li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.pk-t {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.pk-t small {
  color: var(--ink-3);
}

/* 지도 탭 */
.mapfull {
  position: relative;
  margin: 0 -18px;
}
.dmap {
  position: relative;
  width: 100%;
  height: calc(100vh - 218px - env(safe-area-inset-bottom));
  min-height: 380px;
  background: var(--land);
}
.dmap svg,
.wmap svg {
  display: block;
  width: 100%;
  height: 100%;
}
.map-note2 {
  position: absolute;
  left: 12px;
  right: 12px;
  top: 12px;
  margin: 0;
  font-size: 12.5px;
  background: var(--surface);
  border-radius: 12px;
  padding: 8px 12px;
  color: var(--ink-2);
  box-shadow: var(--sh);
}
.legend {
  position: absolute;
  left: 12px;
  top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-width: calc(100% - 24px);
}
.map-note2 ~ .legend,
.legend:has(~ .map-note2) {
  top: 56px;
}
.legend > span {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  background: var(--surface);
  padding: 3px 9px 3px 3px;
  border-radius: 999px;
  box-shadow: var(--sh);
}
.strip {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 12px;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}
.sp {
  flex: none;
  scroll-snap-align: center;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  background: var(--surface);
  border-radius: 16px;
  padding: 10px 14px 10px 10px;
  box-shadow: 0 6px 20px rgba(20, 27, 45, 0.15);
  max-width: 240px;
  border: 2px solid transparent;
}
.sp > span:last-child {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.sp b {
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sp small {
  color: var(--ink-3);
  font-family: var(--num);
}
.sp.on {
  border-color: var(--pri);
}
.sp.on .num {
  background: var(--pri);
  color: #fff;
}

/* 교통비 탭 */
.fare-hero {
  border-radius: 24px;
  padding: 20px 20px 18px;
  background: var(--grad);
  color: #fff;
  box-shadow: 0 12px 30px rgba(255, 90, 54, 0.25);
  margin-top: 6px;
}
.fare-hero small {
  opacity: 0.9;
  font-weight: 600;
}
.fh-n {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin: 4px 0 6px;
}
.fh-n b {
  font-family: var(--num);
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.fh-n span {
  font-family: var(--num);
  font-size: 16px;
  opacity: 0.9;
}
.fare-hero p {
  margin: 0;
  font-size: 14px;
}
.recs-l {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.recs-l li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: var(--surface);
  border-radius: 18px;
  padding: 14px;
  box-shadow: var(--sh);
}
.rk {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  flex: none;
}
.rk .ic {

/* 바텀시트 */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(10, 14, 22, 0.45);
  z-index: 40;
  animation: fade 0.15s;
}
.sheet {
  position: fixed;
  z-index: 41;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(520px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: var(--bg);

}
@keyframes fade {
  from {
    opacity: 0;
  }
}
@keyframes up {
  from {
    transform: translate(-50%, 40px);
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .sheet,
  .scrim,
  .toast {

  .acard {

.h-sun {
  fill: var(--h-sun);
}
.h-cloud {
  fill: var(--h-cloud);
  opacity: var(--h-cloud-o);
}
.h-bird {
  fill: none;
  stroke: var(--h-bird);
  stroke-width: 1.6;
  stroke-linecap: round;
}
.h-mtn {
  fill: var(--h-mtn);
}
.h-city {
  fill: var(--h-city);
}
.h-bld,
.h-bld rect {
  fill: var(--h-bld);
}
.h-b2 {
  fill: var(--h-b2);
}
.h-b3 {
  fill: var(--h-b3);
}
.h-win {
  fill: none;
  stroke: var(--h-win);
  stroke-width: 1.4;
}
.h-domel {
  fill: none;
  stroke: var(--h-dome-l);
  stroke-width: 1.2;
  opacity: 0.6;
}
.h-twhi {
  fill: #fff;
  opacity: 0.22;
}
.h-panel {
  fill: none;
  stroke: var(--h-twl);
  stroke-width: 0.7;
  opacity: 0.3;
}
.h-deck {
  fill: var(--h-deck);
}
.h-deckw {
  fill: var(--h-deckw);
  opacity: 0.9;
}
.h-lat,
.h-lat2 {
  fill: none;
  stroke: var(--h-twl);
  stroke-width: 1.5;
  stroke-linecap: round;
}
.h-tip {
  fill: #ff5a5a;
}
.h-lights rect {
  fill: #ffd98a;
  opacity: 0.9;
}
.h-stars circle {
  fill: #fff;
  animation: twinkle 4s ease-in-out infinite;
}
@keyframes twinkle {
  50% {
    opacity: 0.25;
  }
}
.h-sand {
  fill: var(--h-sand);
}
.h-palm {
  fill: none;
  stroke: var(--h-palm);
  stroke-width: 2.6;
  stroke-linecap: round;
}
.h-frond {
  fill: none;
  stroke: var(--h-palm);
  stroke-width: 3.2;
  stroke-linecap: round;
}
.h-pier {
  fill: var(--h-pier);
}
.h-stilt {
  stroke: var(--h-pier);
  stroke-width: 2;
}
.h-mz {
  fill: var(--h-mz);
}
.h-mzr {
  fill: var(--h-mzr);
}
.h-refl {
  fill: none;
  stroke: var(--h-refl);
  stroke-width: 2.2;
  stroke-linecap: round;
}
.h-refl2 {
  fill: none;
  stroke: var(--h-sun);
  stroke-width: 2.2;
  stroke-linecap: round;
  opacity: 0.6;
}
.h-wave {
  fill: none;
  stroke: var(--h-wave);
  stroke-width: 1.6;
  stroke-linecap: round;
  animation: drift 7s ease-in-out infinite alternate;
}
@keyframes drift {
  to {
    transform: translateX(10px);
  }
}
@media (prefers-reduced-motion: reduce) {
  .h-stars circle,
  .h-wave {
    animation: none;
  }
}

/* 홈 본문 */
.home-body {
  position: relative;
  margin-top: -28px;
  background: var(--bg);
  border-radius: 28px 28px 0 0;
  padding: 26px 18px 40px;
}
.home-body::before {
  content: '';
  position: absolute;
  top: 10px;
  left: 50%;
  width: 50px;
  height: 5px;
  margin-left: -25px;
  border-radius: 3px;
  background: var(--obi);
}
.start {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  padding: 18px 16px 18px 18px;
  border-radius: 24px;
  background: var(--grad);
  color: #fff;
  box-shadow: 0 14px 30px rgba(214, 58, 31, 0.28);
  transition: transform 0.12s;
}
.st-ic {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.2);
  flex: none;
}
.st-ic .ic {
  width: 24px;
  height: 24px;
  stroke-width: 2.4;
}
.st-t {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.st-t b {
  font-size: 18px;
  font-weight: 800;
}
.st-t small {
  font-size: 13px;
  opacity: 0.92;
}
.start .chev {
  width: 22px;
  height: 22px;
}
.feats {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.feats li {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-2);
  background: var(--surface);
  border-radius: 999px;
  padding: 6px 11px 6px 8px;
  box-shadow: var(--sh);
}
.feats .ic {
  width: 15px;
  height: 15px;
  color: var(--pri);
}
.tcard {
  background: var(--surface);
  border-radius: 24px;
  padding: 16px 16px 12px;
  box-shadow: var(--sh);
}
.tc-h {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
}
.tc-h > div {
  display: flex;
  flex-direction: column;
}
.tc-h b {
  font-size: 16px;
  font-weight: 800;
}
.tc-h small {
  color: var(--ink-3);
  font-size: 12.5px;
}
.tc-h .ib {
  color: var(--ink-3);
}
.tcard .mini {
  margin-bottom: 12px;
}
.tc-s {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  padding: 10px 2px 12px;
  border-top: 1px dashed var(--line);
  font-size: 12.5px;
  color: var(--ink-3);
}
.tc-s b {
  color: var(--ink);
  font-weight: 700;
  margin-left: 2px;
}
.qa {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.qa button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 10px 0 9px;
  border-radius: 16px;
  background: var(--surface-2);
  font-size: 12.5px;
  font-weight: 700;
  transition: transform 0.12s;
}
.qa button > span {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--surface);
  color: var(--pri);
  box-shadow: var(--sh);
}
.qa .ic {
  width: 19px;
  height: 19px;
}
.qa button:hover {
  background: var(--surface-3);
}
.newp {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 15px 16px;
  border-radius: 18px;
  background: var(--ink);
  color: var(--bg);
  font-weight: 800;
  font-size: 15px;
  text-align: left;
  transition: transform 0.12s;
}
.newp span {
  flex: 1;
}
.newp .chev {
  opacity: 0.6;
}
.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  text-align: left;
  padding: 14px 14px 13px;
  border-radius: 20px;
  background: var(--surface);
  box-shadow: var(--sh);
  overflow: hidden;
  transition: transform 0.12s;
}
.tile::after {
  content: '';
  position: absolute;
  right: -20px;
  bottom: -20px;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--c) 9%, transparent);
}
.tl-ic {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 13px;
  margin-bottom: 8px;
  background: color-mix(in srgb, var(--c) 12%, var(--surface));
  color: var(--c);
}
.tl-ic .ic {
  width: 21px;
  height: 21px;
}
.tile b {
  font-size: 15.5px;
  font-weight: 800;
}
.tile small {
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.35;
}
.tile:active,
.atile:active,
.start:active,
.newp:active,
.qa button:active {
  transform: scale(0.98);
}
.acar {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  margin: 0 -18px;
  padding: 2px 18px 12px;
  scroll-snap-type: x mandatory;
  scroll-padding: 18px;
  scrollbar-width: none;
}
.acar::-webkit-scrollbar {
  display: none;
}
.atile {
  flex: none;
  width: 152px;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  text-align: left;
  border-radius: 20px;
  background: var(--surface);
  box-shadow: var(--sh);
  overflow: hidden;
  transition: transform 0.12s;
}
.at-art,
.ar-band {
  position: relative;
  color: #fff;
  overflow: hidden;
  background: linear-gradient(150deg, var(--c1), var(--c2));
}
.at-art {
  height: 92px;
}
.at-art::before,
.ar-band::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.16;
  background:
    radial-gradient(
        circle at 50% 100%,
        transparent 8px,
        #fff 8.5px,
        #fff 10px,
        transparent 10.5px,
        transparent 14px,
        #fff 14.5px,
        #fff 16px,
        transparent 16.5px
      )
      0 0 / 36px 18px,
    radial-gradient(
        circle at 50% 100%,
        transparent 8px,
        #fff 8.5px,
        #fff 10px,
        transparent 10.5px,
        transparent 14px,
        #fff 14.5px,
        #fff 16px,
        transparent 16.5px
      )
      18px 9px / 36px 18px;
}
.at-ja {
  position: absolute;
  left: 12px;
  top: 10px;
  font-family: 'Noto Serif JP', serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.04em;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
}
.at-ic {
  position: absolute;
  right: 10px;
  bottom: 9px;
  width: 28px;
  height: 28px;
  opacity: 0.9;
  stroke-width: 1.8;
}
.at-b {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 12px 12px;
  flex: 1;
}
.at-b b {
  font-size: 15px;
  font-weight: 800;
}
.at-b small {
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.8em;
}
.at-b em {
  font-style: normal;
  margin-top: 4px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-3);
}

// engine.js · 일정 짜기 계산
// 새 계획 만들기(createPlan), 하루 계산(computeDay), 이동 방법(legOptions), 교통비(farePlan), 숙소(nightHotel)
// 화면은 그리지 않아요. 계산 규칙(걷는 속도, 식사 시간대, 벌점 등)을 바꿀 때만 여기를 봐요.
// 고치는 법: docs/수정가이드.md

// ===== 일정 엔진 =====
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));
const SPOT = Object.fromEntries(SPOTS.map(s => [s.id, s]));
SPOTS.forEach(s => {
  s.z = AREA[s.a].z;
});
const KX = 92.72,
  KY = 110.95;

// 두 지점 사이 직선 거리(km)
function km(a, b) {
  return Math.hypot((b.lng - a.lng) * KX, (b.lat - a.lat) * KY);
}
// '09:30' → 하루 시작부터 분(570)
function toMin(hm) {
  const [h, m] = hm.split(':').map(Number);
  return h * 60 + m;
}
// 분(570) → '09:30'
function fmt(min) {
  min = Math.round(min);
  const h = Math.floor(min / 60),
    m = ((min % 60) + 60) % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
// '09:30' 에 분을 더한 시각
function addMin(hm, d) {
  return fmt(toMin(hm) + d);
}
// 걷는 시간(분) = 거리 × 16분/km
function wmin(k) {
  return Math.max(1, Math.round(k * 16));
}
// 값을 최소~최대 사이로 자르기
function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}
let UID_N = 0;
// 일정 칸마다 붙이는 고유 번호 만들기
function uid() {
  return 'i' + Date.now().toString(36).slice(-5) + (UID_N++).toString(36) + Math.random().toString(36).slice(2, 5);
}
// 깊은 복사 (원본을 안 건드리게)
function clone(o) {
  return JSON.parse(JSON.stringify(o));
}

const MODE = {
  walk: { n: '도보', color: '#2E9B5F' },
  subway: { n: '지하철', color: '#E8711A' },

// ---- 지하철 경로 ----
const SUB = (() => {
  const adj = {},
    by = {};
  const add = (a, b, w) => {
    (adj[a] = adj[a] || []).push([b, w]);
    (adj[b] = adj[b] || []).push([a, w]);
  };
  for (const [lid, L] of Object.entries(LINES)) {
    L.st.forEach((s, i) => {
      (by[s] = by[s] || []).push(lid);
      if (i > 0) {
        const p = L.st[i - 1];
        add(lid + ':' + p, lid + ':' + s, 0.8 + km(STATIONS[p], STATIONS[s]) * 1.8);
      }
    });
  }
  for (const [s, ls] of Object.entries(by))
    for (let i = 0; i < ls.length; i++)
      for (let j = i + 1; j < ls.length; j++) add(ls[i] + ':' + s, ls[j] + ':' + s, 4);
  add('kuko:tenjin', 'nana:tenjinminami', 6);
  return { adj, by };
})();
const SUB_MEMO = {};
// 지하철 두 역 사이 가장 빠른 길 (환승 포함)
function subRoute(sa, sb) {
  const mk = sa + '>' + sb;
  if (mk in SUB_MEMO) return SUB_MEMO[mk];
  const dist = {},
    prev = {},
    pq = [];
  for (const l of SUB.by[sa]) {
    const k = l + ':' + sa;
    dist[k] = 0;
    pq.push([0, k]);
  }
  let found = null;
  while (pq.length) {
    pq.sort((a, b) => a[0] - b[0]);
    const [d, k] = pq.shift();
    if (d > dist[k]) continue;
    if (k.split(':')[1] === sb) {
      found = k;
      break;
    }
    for (const [n, w] of SUB.adj[k] || []) {
      const nd = d + w;
      if (nd < (dist[n] ?? Infinity)) {
        dist[n] = nd;
        prev[n] = k;
        pq.push([nd, n]);
      }
    }
  }
  if (!found) return (SUB_MEMO[mk] = null);
  const path = [found];
  while (prev[path[0]]) path.unshift(prev[path[0]]);
  const segs = [];
  for (const node of path) {
    const [l, s] = node.split(':'),
      g = segs[segs.length - 1];
    if (g && g.line === l) g.st.push(s);
    else segs.push({ line: l, st: [s] });
  }
  const rides = segs
    .filter(s => s.st.length > 1)
    .map(s => {
      const L = LINES[s.line].st,
        i0 = L.indexOf(s.st[0]),
        i1 = L.indexOf(s.st[s.st.length - 1]);
      let k = 0;
      for (let j = 1; j < s.st.length; j++) k += km(STATIONS[s.st[j - 1]], STATIONS[s.st[j]]);
      return { line: s.line, st: s.st, stops: s.st.length - 1, km: k, toward: LINE_ENDS[s.line][i1 > i0 ? 1 : 0] };
    });
  return (SUB_MEMO[mk] = { min: dist[found], rides });
}
// 어떤 지점에서 가까운 지하철역 최대 3곳 (1.3km 안)
function nearStations(p, max = 1.3) {
  return Object.entries(STATIONS)
    .map(([id, s]) => ({ id, s, d: km(p, s) }))
    .filter(x => x.d <= max)
    .sort((a, b) => a.d - b.d)
    .slice(0, 3);
}
// 두 지점 사이 지하철로 가는 방법 하나 만들기
function subwayOpt(a, b) {
  const A = a.airport ? [{ id: 'airport', s: STATIONS.airport, d: 0 }] : nearStations(a);
  const B = b.airport ? [{ id: 'airport', s: STATIONS.airport, d: 0 }] : nearStations(b);
  let best = null;
  for (const x of A)
    for (const y of B) {
      if (x.id === y.id) continue;
      const r = subRoute(x.id, y.id);
      if (!r) continue;
      const wa = x.d ? wmin(x.d) : 0,
        wb = y.d ? wmin(y.d) : 0;
      const air = a.airport || b.airport ? 12 : 0;
      const total = Math.round(wa + 3 + r.min + wb + air);
      if (!best || total < best.min) best = { x, y, r, wa, wb, air, total };
    }
  if (!best) return null;
  const { x, y, r, wa, wb, air } = best;
  const steps = [];
  if (a.airport) steps.push('국제선 터미널 → 무료 셔틀버스로 국내선 지하철역 (약 10분)');
  if (wa) steps.push(`도보 ${wa}분 → ${STATIONS[x.id].n}역`);
  r.rides.forEach((rd, i) =>
    steps.push(
      `${i ? '갈아타기 → ' : ''}${LINES[rd.line].n} ${rd.toward} 방면 ${rd.stops}정거장 → ${STATIONS[rd.st[rd.st.length - 1]].n}역`
    )
  );
  if (b.airport) steps.push('국내선역 → 무료 셔틀버스로 국제선 터미널 (약 10분)');
  if (wb) steps.push(`도보 ${wb}분 → 도착`);
  const segs = [];
  if (wa) segs.push({ mode: 'walk', pts: [a, x.s] });
  r.rides.forEach(rd => segs.push({ mode: 'subway', line: rd.line, pts: rd.st.map(s => STATIONS[s]) }));
  if (wb) segs.push({ mode: 'walk', pts: [y.s, b] });
  const lineTxt = r.rides.map(rd => LINES[rd.line].n).join('→');
  const rideKm = r.rides.reduce((t, rd) => t + rd.km, 0) * 1.08;
  return {
    mode: 'subway',
    min: best.total,
    label: `${lineTxt} · ${STATIONS[x.id].n} → ${STATIONS[y.id].n}`,
    steps,
    segs,
    fare: [{ k: 'subway', yen: subwayFare(rideKm) }],
    route: { from: x.id, to: y.id, wa, wb, rides: r.rides, airFrom: !!a.airport, airTo: !!b.airport }
  };
}

// ---- 요금 ----
function subwayFare(k) {
  for (const [lim, y] of FARE.subway) if (k <= lim) return y;
  return 380;
}
const inCenter = p => p.lat >= 33.583 && p.lat <= 33.607 && p.lng >= 130.392 && p.lng <= 130.425;
// 시내버스 요금
function busFare(a, b, d) {
  if (a.airport || b.airport) return FARE.airportBus;
  if (inCenter(a) && inCenter(b)) return 150;
  return Math.max(190, Math.round((140 + 30 * d) / 10) * 10);

function nextOpen(t, used) {
  if (!used.L && t < 660) return 660;
  if (!used.D && t < 1050) return 1050;
  return null;
}
// 요일 (0=일)
function weekday(date) {
  return new Date(date + 'T00:00:00').getDay();
}
// 그 날짜가 장소의 시즌인지
function inSeason(s, date) {
  return !s.se || s.se.includes(Number(date.slice(5, 7)));
}
let WD = ['일', '월', '화', '수', '목', '금', '토'];

// ★ 새 계획 만들기: 날짜·숙소·고른 동네로 날마다 일정을 채워요
function createPlan(set, areaIds) {
  const dates = datesBetween(set.start, set.end);
  const N = dates.length;
  const plan = {
    id: 'plan-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    v: 1,
    title: `후쿠오카 ${N > 1 ? N - 1 + '박 ' : ''}${N}일`,
    created: Date.now(),
    updated: Date.now(),
    set: clone(set),
    areas: areaIds.slice(),
    parked: [],
    days: []
  };
  dates.forEach((date, i) => {
    const start = i === 0 ? { kind: 'airport', time: addMin(set.arrive, 50) } : { kind: 'hotel', time: set.dayStart };
    const end = i === N - 1 ? { kind: 'airport', time: addMin(set.depart, -120) } : { kind: 'hotel', time: set.dayEnd };
    if (toMin(end.time) < toMin(start.time) + 60) end.time = addMin(start.time, 60);
    plan.days.push({ date, start, end, items: [], modes: {} });
  });
  if (N > 1)
    plan.days[0].items.push({
      uid: uid(),
      place: 'hotel',
      ni: 0,
      n: '숙소에 짐 맡기기',
      stay: 15,
      src: 'auto',
      fixed: true
    });
  plan.set.stays = normStays(set.stays, N - 1, set.hotel);
  if (!plan.set.stays.length) delete plan.set.stays;
  syncMoveItems(plan);
  const alloc = allocate(
    plan,
    areaIds.map(id => AREA[id])
  );
  plan.days.forEach((day, i) => {
    plan.days[i].areas = alloc[i].map(a => a.id);
    const picks = pickSpots(plan, i, alloc[i]);
    day.items.push(
      ...picks.map(p => {
        const it = mkItem(p.s.id, 'auto');
        if (p.meal) it.meal = p.meal;
        return it;
      })
    );
    reorderDay(plan, i, leadingFixed(day));
    trimDay(plan, i, leadingFixed(day));
  });
  rebalance(plan);
  plan.days.forEach((d, i) => cleanModes(plan, i));
  return plan;
}
// 맨 앞의 고정 칸 수 (짐 맡기기 등)
function leadingFixed(day) {
  let n = 0;
  while (n < day.items.length && day.items[n].fixed) n++;
  return n;
}

// 고른 동네를 날짜에 나누기 (숙소에서 가까운 동네를 그날로)
function allocate(plan, areas) {
  const N = plan.days.length,
    caps = plan.days.map((d, i) => dayCap(plan, i));
  const asg = plan.days.map(() => []),
    load = caps.map(() => 0);
  const need = a => a.min + 2 * accessMin(a.z);
  const edge = i => N > 2 && (i === 0 || i === N - 1);
  const hp = plan.days.map((d, i) => (i < N - 1 ? hotelPt(nightHotel(plan, i)) : null)); // 숙소로 돌아오는 날만 숙소와 가까운 동네를 우선
  const trips = areas.filter(a => a.kind === 'trip');
  const rest = areas.filter(a => a.kind !== 'trip').sort((a, b) => need(b) - need(a));
  for (const t of trips) {
    const order = [...Array(N).keys()]
      .filter(i => !asg[i].some(x => x.kind === 'trip'))
      .sort((i, j) => caps[j] - (edge(j) ? 300 : 0) - load[j] - (caps[i] - (edge(i) ? 300 : 0) - load[i]));
    const i = order.length ? order[0] : load.indexOf(Math.min(...load));
    asg[i].push(t);
    load[i] += need(t);
  }
  for (const a of rest) {
    let bi = 0,
      bc = Infinity;
    for (let i = 0; i < N; i++) {
      const rem = caps[i] - load[i],
        over = Math.max(0, need(a) - rem);
      let c = over * 2 - rem * 0.05;
      if (asg[i].some(x => x.kind === 'trip')) c += 400;
      if (asg[i].length) c += Math.min(...asg[i].map(o => km(o, a))) * 6;
      if (a.kind === 'outer' && asg[i].some(o => o.kind === 'outer')) c += 150;
      if (a.kind === 'outer' && edge(i)) c += 40;
      if (hp[i] && a.z === 'city') c += km(hp[i], a) * 3;
      if (c < bc) {
        bc = c;
        bi = i;
      }
    }
    asg[bi].push(a);
    load[bi] += need(a);
  }
  return asg;
}

// 하루에 넣을 장소·식당 고르기
function pickSpots(plan, i, areas) {
  const day = plan.days[i];
  const s0 = toMin(day.start.time),
    e0 = toMin(day.end.time);
  let budget = dayCap(plan, i);
  areas.forEach(a => {
    if (a.z !== 'city') budget -= 2 * accessMin(a.z);
  });
  const taken = new Set(plan.days.flatMap(d => d.items.map(it => it.sid)).filter(Boolean));
  const ok = s =>
    !taken.has(s.id) &&
    inSeason(s, day.date) &&
    !(s.b === 'n' && e0 < 1080) &&
    !(s.from && e0 < toMin(s.from) + 60) &&
    !(s.to && toMin(s.to) < s0 + 60);
  const ids = new Set(areas.map(a => a.id));
  const picked = [];
  const take = (s, meal) => {
    picked.push({ s, meal });
    taken.add(s.id);
    budget -= s.s + 12;
  };
  const needL = s0 <= 750 && e0 >= 810,
    needD = e0 >= 1170;
  const hasOuter = areas.some(a => a.z !== 'city');
  const meals = SPOTS.filter(s => s.meal && ok(s));
  const near = (pool, ref) => pool.slice().sort((x, y) => km(x, ref) - km(y, ref));
  if (needL) {
    let pool = meals.filter(s => ids.has(s.a) && s.b !== 'n' && !s.pd);
    if (hasOuter && pool.some(s => s.z !== 'city')) pool = pool.filter(s => s.z !== 'city');
    pool.sort((x, y) => y.p - x.p);
    if (!pool.length && areas.length)
      pool = near(
        meals.filter(s => s.b !== 'n' && !s.pd && s.z === areas[0].z),
        areas[0]
      );
    if (pool[0]) take(pool[0], 'L');
  }
  if (needD) {
    let pool = meals
      .filter(s => ids.has(s.a) && ok(s))
      .sort((x, y) => !!(y.b === 'n' || y.pd) - !!(x.b === 'n' || x.pd) || y.p - x.p);
    if (!pool.length || hasOuter) {
      const hotel = hotelPt(dayHotel(plan, i));
      const cityPool = meals.filter(s => s.z === 'city' && (s.b === 'n' || s.pd) && ok(s));
      if (!pool.length || !pool.some(s => s.z === 'city')) pool = near(cityPool, hotel);
    }
    if (pool[0]) take(pool[0], 'D');
  }
  const sum = areas.reduce((t, a) => t + a.min, 0) || 1;
  const B = budget;
  areas.forEach(a => {
    const share = (B * a.min) / sum;
    let used = 0;
    SPOTS.filter(s => s.a === a.id && !s.meal && ok(s))
      .sort((x, y) => y.p - x.p)
      .forEach(s => {
        const c = s.s + 12;
        if (used === 0 || used + c <= share + 10) {
          take(s);
          used += c;
        }
      });
  });
  return picked;
}

// 시간대·식사·마감 시간을 고려해 순서 정하기 (삽입 + 국소 개선)
const outside = (t, a, b) => (t < a ? a - t : t > b ? t - b : 0);
// 도착 시각이 장소와 안 맞을 때 벌점
function timePen(c, arr, ctx) {
  const sp = c.sp,
    it = c.it;
  let p = 0;
  if (it.meal === 'L') p += outside(arr, 690, 810) * 1.2;
  else if (it.meal === 'D') p += outside(arr, 1080, 1200) * 1.2;
  if (sp) {
    if (sp.from && arr < toMin(sp.from)) p += (toMin(sp.from) - arr) * 1.5;
    if (sp.b === 'n' && arr < 1080) p += (1080 - arr) * 0.8;
    if (sp.b === 'e') p += outside(arr, ctx.sunset - 70, ctx.sunset + 10) * 0.5;
    if (sp.b === 'm' && arr > 660) p += (arr - 660) * 0.25;
    if (sp.to && arr + it.stay > toMin(sp.to)) p += (arr + it.stay - toMin(sp.to)) * 1.5;
  }
  return p;
}
// 방문 순서 하나의 점수 (짧을수록 좋음)
function seqEval(ctx, seq) {
  let t = ctx.t,
    cur = ctx.cur,
    cost = 0;
  for (const c of seq) {
    const m = bestOpt(cur, c.pt).min;
    t += m;
    cost += m + timePen(c, t, ctx);
    t += c.it.stay;
    cur = c.pt;
  }
  const m = bestOpt(cur, ctx.endPt).min;
  t += m;
  cost += m;
  if (t > ctx.deadline) cost += (t - ctx.deadline) * 3;
  return cost;
}
// 방문 순서 고르기 (가장 덜 돌아가게)
function optimize(ctx, cands) {
  const strength = c =>
    (c.it.meal ? 3 : 0) +
    (c.sp && (c.sp.b || c.sp.from) ? 2 : 0) +
    (c.sp && c.sp.to ? 1 : 0) +
    (c.sp ? c.sp.p * 0.1 : 0);
  let seq = [];
  for (const c of cands.slice().sort((a, b) => strength(b) - strength(a))) {
    let best = null,
      bc = Infinity;
    for (let k = 0; k <= seq.length; k++) {
      const s2 = seq.slice(0, k).concat([c], seq.slice(k));
      const v = seqEval(ctx, s2);
      if (v < bc) {
        bc = v;
        best = s2;
      }
    }
    seq = best;
  }
  let cur = seqEval(ctx, seq);
  for (let pass = 0; pass < 8; pass++) {
    let imp = false;
    for (let i = 0; i < seq.length; i++)
      for (let j = 0; j < seq.length; j++) {
        if (i === j) continue;
        const s2 = seq.slice();
        const [x] = s2.splice(i, 1);
        s2.splice(j, 0, x);
        const v = seqEval(ctx, s2);
        if (v < cur - 0.5) {
          seq = s2;
          cur = v;
          imp = true;
        }
      }
    for (let i = 0; i < seq.length - 1; i++)
      for (let j = i + 2; j <= seq.length; j++) {
        const s2 = seq.slice(0, i).concat(seq.slice(i, j).reverse(), seq.slice(j));
        const v = seqEval(ctx, s2);
        if (v < cur - 0.5) {
          seq = s2;
          cur = v;
          imp = true;
        }
      }
    if (!imp) break;
  }
  return seq;
}

// ★ 하루 계산: 칸마다 도착·출발 시각, 이동 방법, 경고, 마무리 시각
function computeDay(plan, di) {
  const day = plan.days[di];
  const startPt = anchorPt(plan, day.start, di, false),
    endPt = anchorPt(plan, day.end, di, true);
  let t = toMin(day.start.time),
    cur = startPt,
    ck = 'S';
  const rows = [],
    wd = weekday(day.date),
    mon = Number(day.date.slice(5, 7));
  for (const it of day.items) {
    const p = itemPt(plan, it),
      key = ck + '>' + it.uid,
      leg = chooseLeg(cur, p, day.modes[key], day.date);
    const arr = t + leg.min,
      dep = arr + it.stay,
      warn = [];
    const s = it.sid && SPOT[it.sid];
    if (s) {
      if (s.cl && s.cl.includes(wd)) warn.push(`${WD[wd]}요일은 휴관일 수 있어요`);
      if (s.se && !s.se.includes(mon)) warn.push('시즌이 아닐 수 있어요');
      if (s.from && arr < toMin(s.from)) warn.push(`${s.from} 이후에 문을 열어요`);
      else if (s.b === 'n' && arr < 1050) warn.push('저녁 이후에 가면 더 좋아요');
      if (s.b === 'e' && arr < SUNSET[mon] - 120) warn.push('해 질 무렵에 가면 더 좋아요');
      if (s.to && dep > toMin(s.to)) warn.push(`${s.to}쯤 문을 닫아요`);
    }
    rows.push({ it, p, leg, key, arr, dep, warn, from: cur });
    t = dep;
    cur = p;
    ck = it.uid;
  }
  const endKey = ck + '>E',
    endLeg = chooseLeg(cur, endPt, day.modes[endKey], day.date);
  const endArr = t + endLeg.min,
    deadline = toMin(day.end.time);
  const walkKm =
    rows.reduce((s, r) => s + (r.leg.mode === 'walk' ? r.leg.km : 0), 0) + (endLeg.mode === 'walk' ? endLeg.km : 0);
  return {
    day,
    rows,
    startPt,
    endPt,
    endLeg,
    endKey,
    endArr,
    deadline,
    over: endArr - deadline,
    start: toMin(day.start.time),
    walkKm,
    lastPt: cur
  };
}

// 앞 칸에서 이미 먹은 식사
function mealsUsedBefore(plan, di, n) {
  const c = computeDay(plan, di),
    used = {};
  c.rows.slice(0, n).forEach(r => {
    const s = r.it.sid && SPOT[r.it.sid];
    if (s && s.meal) used[r.it.meal || mealWin(r.arr) || (r.arr < 960 ? 'L' : 'D')] = true;
  });
  return { used, c };
}
// 장소 우선순위 점수
function pri(it) {
  return it.sid ? SPOT[it.sid].p : 3;
}

// fixedCount 이후의 일정을 다시 짠다
function reorderDay(plan, di, fixedCount) {
  const day = plan.days[di];
  const { used, c } = mealsUsedBefore(plan, di, fixedCount);
  const cur = fixedCount ? c.rows[fixedCount - 1].p : c.startPt;
  const t = fixedCount ? c.rows[fixedCount - 1].dep : c.start;
  const rest = day.items.slice(fixedCount);
  const open = new Set();
  if (!used.L && t <= 810 && c.deadline >= 720) open.add('L');
  if (!used.D && c.deadline >= 1110) open.add('D');
  const parked = [];
  const meals = rest
    .filter(it => it.sid && SPOT[it.sid].meal)
    .sort((a, b) => (b.meal ? 1 : 0) - (a.meal ? 1 : 0) || (b.src !== 'auto') - (a.src !== 'auto') || pri(b) - pri(a));
  for (const m of meals) {
    if (m.meal && open.has(m.meal)) {
      open.delete(m.meal);
      continue;
    }
    const alt = [...open].find(w => !(w === 'L' && SPOT[m.sid].b === 'n'));
    if (alt) {
      m.meal = alt;
      open.delete(alt);
      continue;
    }
    if (m.src === 'auto')
      parked.push({
        it: m,
        reason:
          (used.L && used.D) || (m.meal && used[m.meal])
            ? '식사가 이미 계획돼 있어서 보류'
            : '식사 시간대와 맞지 않아 보류'
      });
    else m.meal = null;
  }
  const keep = rest.filter(it => !parked.some(p => p.it === it));
  const ctx = { cur, t, endPt: c.endPt, deadline: c.deadline, sunset: SUNSET[Number(day.date.slice(5, 7))] };
  const seq = optimize(
    ctx,
    keep.map(it => ({ it, pt: itemPt(plan, it), sp: it.sid ? SPOT[it.sid] : null }))
  );
  day.items = [...day.items.slice(0, fixedCount), ...seq.map(x => x.it)];
  parked.forEach(p => park(plan, di, p.it, p.reason));
  return {
    before: rest.map(i => i.uid),
    after: seq.map(x => x.it.uid),
    parked: parked.map(p => ({ n: itemName(plan, p.it), reason: p.reason }))
  };
}
// 일정에서 빼서 보류함으로
function park(plan, di, it, reason) {
  plan.parked = plan.parked.filter(p => p.uid !== it.uid);
  const { meal, ...rest } = it;
  plan.parked.push({ ...rest, reason, fromDay: di });
}
// 시간이 넘치는 하루에서 덜 중요한 곳 빼기
function trimDay(plan, di, fixedCount) {
  const out = [];
  for (let guard = 0; guard < 30; guard++) {
    const c = computeDay(plan, di);
    if (c.over <= 10) break;
    const day = plan.days[di];
    const cand = day.items
      .map((it, idx) => ({ it, idx }))
      .filter(x => x.idx >= fixedCount && x.it.src === 'auto' && !x.it.fixed);
    if (!cand.length) break;
    const nonMeal = cand.filter(x => !(x.it.sid && SPOT[x.it.sid].meal));
    const pool = nonMeal.length ? nonMeal : cand;
    pool.sort((a, b) => pri(a.it) - pri(b.it) || b.it.stay - a.it.stay);
    const v = pool[0];
    day.items.splice(v.idx, 1);
    park(plan, di, v.it, '시간이 부족해서 보류');
    out.push({ n: itemName(plan, v.it), reason: '시간이 부족해서 보류' });
    reorderDay(plan, di, fixedCount);
  }
  return out;
}
// 없어진 칸의 이동 방법 기록 지우기
function cleanModes(plan, di) {
  const day = plan.days[di],
    keys = new Set();
  let ck = 'S';
  day.items.forEach(it => {
    keys.add(ck + '>' + it.uid);
    ck = it.uid;
  });
  keys.add(ck + '>E');
  Object.keys(day.modes).forEach(k => {
    if (!keys.has(k)) delete day.modes[k];
  });
}
// 시간이 모자라 보류된 곳을 여유 있는 다른 날로 옮겨 본다
function rebalance(plan) {
  for (const p of plan.parked.filter(x => x.reason.startsWith('시간') && x.sid)) {
    const slack = j => {
      const c = computeDay(plan, j);
      return c.deadline - c.endArr;
    };
    const order = plan.days
      .map((d, j) => ({ j, s: slack(j) }))
      .filter(
        x =>
          x.j !== p.fromDay &&
          x.s > p.stay + 30 &&
          (plan.days[x.j].areas || []).some(
            aid => aid === SPOT[p.sid].a || (AREA[aid].z === SPOT[p.sid].z && km(AREA[aid], AREA[SPOT[p.sid].a]) < 3)
          )
      )
      .sort((a, b) => b.s - a.s);
    for (const { j } of order) {
      const snapDay = clone(plan.days[j]),
        snapParked = clone(plan.parked);
      const endBefore = computeDay(plan, j).endArr;
      const { reason, fromDay, ...it } = p;
      plan.days[j].items.push(it);
      reorderDay(plan, j, leadingFixed(plan.days[j]));
      const c = computeDay(plan, j);
      if (c.over <= 0 && plan.days[j].items.some(x => x.uid === it.uid) && c.endArr - endBefore - it.stay <= 45) {
        plan.parked = plan.parked.filter(x => x.uid !== p.uid);
        cleanModes(plan, j);
        break;
      }
      plan.days[j] = snapDay;
      plan.parked = snapParked;
    }
  }
}

// 고정 구간 이후 재계획 + 요약
function replanFrom(plan, di, fixedCount, added = []) {
  const before = computeDay(plan, di);
  const r = reorderDay(plan, di, fixedCount);
  const trimmed = trimDay(plan, di, fixedCount);
  cleanModes(plan, di);
  const after = computeDay(plan, di);
  const items = plan.days[di].items.slice(fixedCount).map(i => i.uid);
  const pos = u => r.before.indexOf(u);
  let moved = 0;
  for (let k = 1; k < items.length; k++) if (pos(items[k]) < pos(items[k - 1])) moved++;
  return {
    added,
    parked: [...r.parked, ...trimmed],
    moved,
    rest: items.length,
    endBefore: before.endArr,
    endAfter: after.endArr,
    over: after.over
  };
}

// ---- 도보 동선 추천 ----
function legEnds(plan, di, li) {
  const c = computeDay(plan, di),
    day = plan.days[di];
  const A = li === 0 ? c.startPt : c.rows[li - 1].p;
  const B = li < c.rows.length ? c.rows[li].p : c.endPt;
  const tA = li === 0 ? c.start : c.rows[li - 1].dep;
  const Akey = li === 0 ? 'S' : day.items[li - 1].uid;
  const Bkey = li < day.items.length ? day.items[li].uid : 'E';
  return { A, B, tA, Akey, Bkey, c };
}
// 지도 계산용 좌표 변환
function proj(A, B, P) {
  const bx = (B.lng - A.lng) * KX,
    by = (B.lat - A.lat) * KY,
    px = (P.lng - A.lng) * KX,
    py = (P.lat - A.lat) * KY;
  const L2 = bx * bx + by * by || 1e-9,
    t = (px * bx + py * by) / L2;
  return { t, d: Math.hypot(px - t * bx, py - t * by) };
}
// 걸어가는 길 위 추천 장소
function walkRecs(plan, di, li) {
  const { A, B, tA } = legEnds(plan, di, li);
  if (A.z !== B.z) return { err: '다른 지역으로 넘어가는 구간이라 걸어서 갈 수 없어요.' };
  if ((A.airport || B.airport) && km(A, B) >= 2) return { err: '공항 구간은 걸어서 가기 어려워요.' };
  const L = km(A, B);
  if (L > 7) return { err: `${L.toFixed(1)}km라 걸어가기엔 너무 멀어요.` };

  const recs = [];
  for (const s of SPOTS) {
    if (s.z !== A.z || inPlan.has(s.id) || s.g) continue;
    const { t, d } = proj(A, B, s);
    if (t < -0.08 || t > 1.08) continue;
    const dd = t < 0 ? km(A, s) : t > 1 ? km(B, s) : d;

    if (s.from && eta < toMin(s.from) - 30) continue;

    if (s.meal && mealWin(eta)) score += 12;
    if (s.b === 'n') score += eta >= 1050 ? 8 : -15;

  if (yDays.length) {
    const i = yDays[0],
      same = days[i].zones.includes('dazaifu');
    const nishi = g(days[i], 'nishi') + days[i].boat;
    multi.push({
      id: 'dzy',

      price: FARE.dzYanagawa,
      value: nishi,
      from: i,

  const daily = dayRes.reduce((t, d) => t + d.best, 0);

// 날짜 → '2026-12-11'
function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
// '2026-12-11' → 날짜
function pd(s) {
  return new Date(s + 'T00:00:00');
}
// 날짜 → '12월 11일 (금)'
function md(s) {
  const d = pd(s);
  return LANG === 'ja'
    ? `${d.getMonth() + 1}月${d.getDate()}日(${WD[d.getDay()]})`
    : `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
}
// 날짜 → '12.11 금'
function mds(s) {
  const d = pd(s);
  return LANG === 'ja'
    ? `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`
    : `${d.getMonth() + 1}.${d.getDate()} ${WD[d.getDay()]}`;
}
// 일수 → '2박 3일'
function nights(n) {
  return LANG === 'ja' ? (n <= 1 ? '日帰り' : `${n - 1}泊${n}日`) : n <= 1 ? '당일치기' : `${n - 1}박 ${n}일`;
}
// 분 → '1시간 30분'
function dur(m) {
  m = Math.round(m);
  const h = Math.floor(m / 60),
    r = m % 60;
  return LANG === 'ja'
    ? h
      ? `${h}時間${r ? r + '分' : ''}`
      : `${r}分`
    : h
      ? `${h}시간${r ? ' ' + r + '분' : ''}`
      : `${r}분`;
}
// km → '524m'·'1.2km'
function dist(k) {
  return k < 1 ? Math.round(k * 1000) + 'm' : k.toFixed(1) + 'km';
}
// 오늘 날짜
function today() {
  return ymd(new Date());
}
// 두 날짜 사이 일수
function dayDiff(a, b) {
  return Math.round((pd(b) - pd(a)) / 864e5);
}

function lsGet(k, d) {
  try {
    const v = localStorage.getItem(k);
    return v == null ? d : JSON.parse(v);
  } catch (e) {
    return d;
  }
}
// 이 기기에 값 저장하기
function lsSet(k, v) {
  try {
    localStorage.setItem(k, JSON.stringify(v));
    return true;
  } catch (e) {
    return false;
  }
}

      const snap = await Promise.race([
        col.get(),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))
      ]);
      this.col = col;
      this.mode = 'account';
      const remote = snap.docs
        .filter(d => d.exists && d.id.startsWith('plan-'))
        .map(d => d.data())
        .filter(p => p && p.days)
        .map(prunePlan);
      const map = new Map();
      [...S.plans, ...remote].forEach(p => {
        const o = map.get(p.id);
        if (!o || (p.updated || 0) > (o.updated || 0)) map.set(p.id, clone(p));
      });
      const merged = [...map.values()],
        rIds = new Map(remote.map(p => [p.id, p.updated || 0]));
      merged.forEach(p => {
        if (!rIds.has(p.id) || rIds.get(p.id) < (p.updated || 0)) this.put(p);
      });
      S.plans = merged;
      this.writeLocal(merged);
      if (S.view === 'home') render();
      else updateStoreNote();
    } catch (e) {
      updateStoreNote();
    }
  },
  put(plan) {
    if (!this.col) return Promise.resolve();
    const id = plan.id,
      body = clone(plan);
    this.q[id] = (this.q[id] || Promise.resolve())
      .then(() => this.col.doc(id).set(body))
      .catch(e => {
        if (e && e.code === 'quota_exceeded') toast('계정 저장 공간이 가득 찼어요. 이 브라우저에는 저장됐어요.');
      });
    return this.q[id];
  },
  remove(id) {
    if (!this.col) return;
    this.q[id] = (this.q[id] || Promise.resolve()).then(() => this.col.doc(id).delete()).catch(() => {});
  }
};

// 계획 상태 (D-19, 여행 중, 지난 여행)
function planStatus(p) {
  const t = today();
  if (t < p.set.start) return { k: 'soon', label: `D-${dayDiff(t, p.set.start)}`, di: 0 };
  if (t <= p.set.end) {
    const i = dayDiff(p.set.start, t);
    return { k: 'now', label: `여행 ${i + 1}일차`, di: i };
  }
  return { k: 'past', label: '다녀온 여행', di: 0 };
}
// 계획 목록 (가까운 여행 먼저)
function sortedPlans() {
  const rank = p => ({ now: 0, soon: 1, past: 2 })[planStatus(p).k];
  return S.plans
    .slice()
    .sort(
      (a, b) =>
        rank(a) - rank(b) ||
        (rank(a) === 2 ? b.set.start.localeCompare(a.set.start) : a.set.start.localeCompare(b.set.start))
    );
}

function addMonth(s, n) {

// 달력 한 달
function monthV(first) {
  const d0 = pd(first),
    y = d0.getFullYear(),
    m = d0.getMonth(),
    t = today(),
    D = S.draft;
  const startW = d0.getDay(),
    days = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < startW; i++) cells += '<span></span>';
  for (let k = 1; k <= days; k++) {
    const s = ymd(new Date(y, m, k)),
      wd = (startW + k - 1) % 7;
    const past = s < t,
      isS = s === D.start,
      isE = s === D.end,
      inR = D.start && D.end && s > D.start && s < D.end;
    const cls = [
      'dc',
      past && 'past',
      isS && 's',
      isE && 'e',
      inR && 'in',
      D.start && D.end && D.start !== D.end && isS && 'rs',
      D.start && D.end && D.start !== D.end && isE && 're',
      s === t && 'today',
      wd === 0 && 'sun',
      wd === 6 && 'sat'
    ]
      .filter(Boolean)
      .join(' ');
    cells += `<button class="${cls}" ${past ? 'disabled' : ''} data-act="pickDate" data-d="${s}" aria-label="${md(s)}"${isS || isE ? ' aria-pressed="true"' : ''}><span>${k}</span></button>`;
  }
  return `<div class="month"><div class="wk">${WD.map(w => `<span>${w}</span>`).join('')}</div><div class="grid">${cells}</div></div>`;
}

// ---- 2단계: 지역 ----
function draftCaps() {
  const D = S.draft,
    dates = datesBetween(D.start, D.end),
    N = dates.length;
  let total = 0;
  dates.forEach((d, i) => {
    const s = i === 0 ? toMin(D.arrive) + 50 : toMin(D.dayStart),
      e = i === N - 1 ? toMin(D.depart) - 120 : toMin(D.dayEnd);
    total += Math.max(0, e - s - 25 - (i === 0 ? 25 : 0));
  });
  const need =
    D.areas.reduce((t, id) => t + AREA[id].min + 2 * accessMin(AREA[id].z), 0) +
    D.areas.length * 15 +
    (D.areas.length ? N * 90 : 0);
  return { N, total, need, trips: D.areas.filter(a => AREA[a].kind === 'trip').length };
}

// 직접 순서를 바꿨더니 하루가 늦어질 때만, 뒤쪽을 다시 짤지 물어봐요
function reAskRow(it, c) {
  const q = S.reAsk;
  if (!q || q.uid !== it.uid || q.di !== S.di || q.at !== S.editN) return '';
  const head =
    c.over > 0
      ? L(
          `순서를 바꿨더니 마무리 시간보다 <b>${c.over}분</b> 늦어요`,
          `順番を変えたら、終了予定より<b>${c.over}分</b>遅れます`
        )
      : L(
          `순서를 바꿨더니 하루가 <b>${q.diff}분</b> 늦게 끝나요`,
          `順番を変えたら、1日の終わりが<b>${q.diff}分</b>遅くなります`
        );

    <p>${ic('shuffle')}<span><em class="ask-t">${head}</em><small>${L('여기까지는 바꾼 순서 그대로 두고, 뒤쪽 일정만 다시 짤까요?', 'ここまでは変えた順番のままにして、後ろの予定だけ組み直しますか?')}</small></span></p>

// 택시로만 다닐 때 요금
function taxiAll(p, di) {
  const c = computeDay(p, di);
  let t = 0;
  [...c.rows.map(r => r.leg), c.endLeg].forEach(l => {
    const w = l.opts.find(o => o.mode === 'walk'),
      tx = l.opts.find(o => o.mode === 'taxi' || o.mode === 'car');
    if (w && w.min <= 10) return;
    if (tx) t += fareSum(tx.fare);
    else t += fareSum(l.fare);
  });
  return t;
}

function ptName(p, di, li) {
  const day = p.days[di];
  if (li === 0) return day.start.kind === 'airport' ? '공항' : '숙소';
  return itemName(p, day.items[li - 1]);
}
// 시트: 이동 방법 바꾸기
function legSheet(sh) {
  const p = S.plan,
    c = computeDay(p, S.di),
    li = sh.li,
    { A, B } = legEnds(p, S.di, li);
  const cur = li < c.rows.length ? c.rows[li].leg : c.endLeg,
    opts = cur.opts;
  const aN = ptName(p, S.di, li),
    bN = li < c.rows.length ? itemName(p, c.rows[li].it) : c.day.end.kind === 'airport' ? '공항' : '숙소';
  const view = sh.mode || cur.id,
    hasWalk = opts.some(o => o.mode === 'walk');
  const cheapest = Math.min(...opts.filter(o => !o.isOff && !fareUnknown(o.fare)).map(o => fareSum(o.fare)));
  const fastest = Math.min(...opts.filter(o => !o.isOff).map(o => o.min));
  let walkPart = '';
  if (view === 'walk') {
    if (!sh.recs) sh.recs = walkRecs(p, S.di, li);
    const R = sh.recs;
    if (R.err) walkPart = `<p class="note">${ic('alert')}<span>${esc(R.err)}</span></p>`;
    else {
      const sumAdd = R.recs.filter(r => sh.picks.includes(r.s.id)).reduce((t, r) => t + r.add, 0);
      walkPart = `<section class="walk">
        <h3>${ic('walk')}걸어가는 길에 들를 만한 곳</h3>
        <p class="sub">${esc(aN)} → ${esc(bN)} 약 ${dist(R.L)}, ${R.walk}분 · 길 양옆 ${Math.round(R.corridor * 1000)}m 안쪽이에요. 고르면 이 구간에 넣고 이후 일정을 다시 짜요.</p>
        <div class="wmap" id="wmap"></div>
        ${
          R.recs.length
            ? `<div class="recs">${R.recs
                .map((r, k) => {
                  const on = sh.picks.includes(r.s.id);
                  return `<button class="rec${on ? ' on' : ''}" data-act="recToggle" data-id="${r.s.id}" aria-pressed="${on}">
            ${catTile(r.s.c)}<span class="rb"><b><span class="rn">${k + 1}</span>${esc(r.s.n)}</b><small>${esc(r.s.d)}</small><small class="rm">${fmt(r.eta)}쯤 · 길에서 ${Math.round(r.dd * 1000)}m · 일정 +${r.add}분${r.s.meal ? ' · 식사' : ''}</small></span>
            <span class="tick">${on ? ic('check') : ''}</span></button>`;
                })
                .join('')}</div>`
            : `<p class="note">${ic('walk')}<span>이 길 근처엔 추천할 곳이 아직 없어요. 걷기만 해도 좋아요.</span></p>`
        }
      </section>`;
    }
  }
  const foot =
    view === 'walk' && sh.recs && !sh.recs.err
      ? `<div class="sh-foot"><button class="btn soft" data-act="walkOnly">걷기만</button><button class="btn pri" data-act="applyWalk" ${sh.picks.length ? '' : 'disabled'}>${sh.picks.length ? `${sh.picks.length}곳 넣고 다시 짜기 · +${sumAddOf(sh)}분` : '들를 곳을 골라 주세요'}</button></div>`
      : '';
  return `<div class="sh-h"><div><h2>이동 방법</h2><p>${esc(aN)} → ${esc(bN)} · ${dist(km(A, B))}</p></div><button class="ib sm" data-act="closeSheet" aria-label="닫기">${ic('close')}</button></div>
    ${savedNow() ? `<button class="to-guide" data-act="toGuide" data-li="${li}">${ic('nav')}<span><b>이 구간 타는 법 보기</b><small>타는 역·방면·내리는 역을 일본어와 함께</small></span>${ic('next')}</button>` : ''}
    <div class="opts">${opts
      .map(o => {
        const on = o.id === view,
          ft = fareTxt(o.fare) || '무료';
        const badges = [
          o.id === cur.id ? '<span class="tag">지금</span>' : '',
          !o.isOff && o.min === fastest ? '<span class="tag fast">가장 빠름</span>' : '',
          !o.isOff && fareSum(o.fare) === cheapest && opts.length > 1 ? '<span class="tag cheap">가장 쌈</span>' : '',
          o.mode === 'walk' ? '<span class="tag walk">길 위 추천</span>' : ''
        ].join('');
        return `<button class="opt${on ? ' on' : ''}${o.isOff ? ' off' : ''}" data-act="legMode" data-mode="${o.id}" aria-pressed="${on}" ${o.isOff ? 'disabled' : ''}>
        ${modeIc(o.mode)}<span class="ob"><span class="o1"><b>${MODE[o.mode].n}</b>${badges}</span>
        <span class="o2"><b>${o.min}분</b><em>${ft}</em></span>
        <span class="ol">${esc(o.label)}</span>
        ${o.steps && o.steps.length ? `<ol class="osteps">${o.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}
        ${o.isOff ? `<span class="onote">${esc(o.off.note)}</span>` : o.note ? `<span class="onote">${esc(o.note)}</span>` : ''}</span></button>`;
      })
      .join('')}</div>
    ${!hasWalk ? `<p class="note">${ic('alert')}<span>${A.z !== B.z ? '다른 지역으로 넘어가는 구간이라 걷기는 고를 수 없어요.' : '이 구간은 걸어가기 어려워요.'}</span></p>` : ''}
    ${walkPart}${foot}`;
}
// 장소 추가 시 시간 계산
function sumAddOf(sh) {
  return sh.recs.recs.filter(r => sh.picks.includes(r.s.id)).reduce((t, r) => t + r.add, 0);
}
// 시트: 장소 추가
function addSheet(sh) {
  return `<div class="sh-h"><div><h2>${S.di + 1}일차에 장소 추가</h2><p>가장 덜 돌아가는 자리에 넣어 드려요.</p></div><button class="ib sm" data-act="closeSheet" aria-label="닫기">${ic('close')}</button></div>
    <label class="search">${ic('search')}<span class="sr">장소 검색</span><input id="addQ" data-input="addQ" value="${esc(sh.q)}" placeholder="이름·동네·종류 (예: 라멘, 텐진)"></label>
    <div class="chips-sel scroll">${[['all', '전체'], ...Object.entries(CATS).map(([k, v]) => [k, v.n])].map(([k, v]) => `<button class="${sh.cat === k ? 'on' : ''}" data-act="addCat" data-v="${k}">${v}</button>`).join('')}</div>
    <div class="add-list" id="addList">${addListHTML(sh)}</div>

      <button class="btn pri" data-act="addCustom">${ic('plus')}마지막에 넣기</button>
    </details>`;
}
// 장소 추가 목록
function addListHTML(sh) {
  const p = S.plan,
    day = p.days[S.di],
    q = sh.q.trim().toLowerCase();
  const where = {};
  p.days.forEach((d, k) =>
    d.items.forEach(it => {
      if (it.sid) where[it.sid] = k;
    })
  );
  const pts = day.items.map(it => itemPt(p, it));
  const ref = pts.length
    ? { lat: pts.reduce((t, x) => t + x.lat, 0) / pts.length, lng: pts.reduce((t, x) => t + x.lng, 0) / pts.length }
    : hotelPt(dayHotel(p, S.di));
  const list = SPOTS.filter(
    s =>
      (sh.cat === 'all' || s.c === sh.cat) &&
      (!q || (s.n + s.j + AREA[s.a].n + CATS[s.c].n + s.d).toLowerCase().includes(q))
  )
    .map(s => ({ s, d: km(ref, s), mine: (day.areas || []).includes(s.a) }))
    .sort((a, b) => b.mine - a.mine || a.d - b.d)
    .slice(0, 40);
  if (!list.length)
    return `<p class="note">${ic('search')}<span>찾는 곳이 없어요. 아래에서 직접 넣을 수 있어요.</span></p>`;
  return `<ul>${list
    .map(({ s, d }) => {
      const w = where[s.id],
        added = (sh.added || []).includes(s.id);
      return `<li><button class="al-b" data-act="spotSheet" data-id="${s.id}" aria-label="${esc(s.n)} 정보 보기">${catTile(s.c)}<span class="al-t"><b>${esc(s.n)}</b><small>${AREA[s.a].n} · ${dur(s.s)} · 지금 동선에서 ${dist(d)}</small></span></button>
      ${added ? `<span class="tag walk">${ic('check')}넣음</span>` : w != null ? `<span class="tag">${w + 1}일차</span>` : `<button class="btn soft sm" data-act="addSpot" data-id="${s.id}">추가</button>`}</li>`;
    })
    .join('')}</ul>`;
}
// 시트: 하루 시작·마무리 시간
function dayTimeSheet() {
  const day = S.plan.days[S.di];
  return `<div class="sh-h"><div><h2>${S.di + 1}일차 시간</h2><p>바꾸면 이 날 일정을 다시 맞춰요.</p></div><button class="ib sm" data-act="closeSheet" aria-label="닫기">${ic('close')}</button></div>
    <div class="grid2">${selT('dtStart', day.start.time, day.start.kind === 'airport' ? '공항에서 출발' : '숙소에서 출발')}${selT('dtEnd', day.end.time, day.end.kind === 'airport' ? '공항 도착 기준' : '숙소 도착')}</div>
    <div class="sh-foot"><button class="btn soft" data-act="closeSheet">취소</button><button class="btn pri" data-act="applyDayTime">적용하고 다시 짜기</button></div>`;

// 시트: 여행 이름 바꾸기
function renameSheet() {
  return `<div class="sh-h"><div><h2>여행 이름</h2></div><button class="ib sm" data-act="closeSheet" aria-label="닫기">${ic('close')}</button></div>
